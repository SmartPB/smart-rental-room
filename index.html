<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Smart rental room</title>
<style>
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#ECF0F8; --surface-3:#E3E8F4;
  --border:#DBE1EF; --text:#182034; --text-muted:#616B84;
  --primary:#22407A; --primary-strong:#16305E; --primary-soft:#E4EBFB;
  --accent:#A9720E; --accent-soft:#F7ECD6;
  --success:#1C8A5C; --success-soft:#DFF3E8;
  --warning:#A9720E; --warning-soft:#FBEDD3;
  --danger:#C0392B; --danger-soft:#FBE1DD;
  --sans:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 6px 20px rgba(20,30,60,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1119; --surface:#161C2C; --surface-2:#1D2438; --surface-3:#252D46;
    --border:#2B3350; --text:#E8EBF6; --text-muted:#98A2C0;
    --primary:#84A5EC; --primary-strong:#AFC5F4; --primary-soft:#1C2740;
    --accent:#E3B564; --accent-soft:#2F2717;
    --success:#4ADE94; --success-soft:#0F2A1F;
    --warning:#E3B564; --warning-soft:#2F2717;
    --danger:#F87171; --danger-soft:#341917;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1119; --surface:#161C2C; --surface-2:#1D2438; --surface-3:#252D46;
  --border:#2B3350; --text:#E8EBF6; --text-muted:#98A2C0;
  --primary:#84A5EC; --primary-strong:#AFC5F4; --primary-soft:#1C2740;
  --accent:#E3B564; --accent-soft:#2F2717;
  --success:#4ADE94; --success-soft:#0F2A1F;
  --warning:#E3B564; --warning-soft:#2F2717;
  --danger:#F87171; --danger-soft:#341917;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);margin:0;min-height:100vh;}
h1,h2,h3,h4{font-weight:700;margin:0 0 4px;text-wrap:balance;}
p{margin:0 0 8px;}
::selection{background:var(--primary-soft);}
button{font-family:var(--sans);cursor:pointer;}
input,select,textarea{font-family:var(--sans);}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;}
.mono{font-family:var(--mono);}
a{color:var(--primary);}

#app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{width:240px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{padding:20px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(155deg,var(--primary),var(--primary-strong));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex:none;}
.brand-name{font-weight:800;font-size:16.5px;letter-spacing:.2px;}
.brand-sub{font-size:11px;color:var(--text-muted);margin-top:1px;}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);
  color:var(--text-muted);text-decoration:none;font-size:14.5px;font-weight:600;border:1px solid transparent;
  background:none;text-align:left;width:100%;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--primary-soft);color:var(--primary-strong);}
.nav-item .ic{width:18px;text-align:center;flex:none;font-size:14px;}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:800;
  border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-muted);}

/* ---------- Topbar ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{min-height:60px;flex:none;border-bottom:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:space-between;padding:10px 22px;position:sticky;top:0;z-index:20;gap:12px;flex-wrap:wrap;}
.topbar-title{font-size:17px;font-weight:800;}
.topbar-sub{font-size:12px;color:var(--text-muted);font-weight:500;}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.who-edit{display:flex;align-items:center;gap:10px;background:none;border:1px solid transparent;border-radius:var(--radius-sm);padding:3px 6px 3px 3px;text-align:left;}
.who-edit:hover{background:var(--surface-2);border-color:var(--border);}
.who-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;}
.who-name{font-size:13.5px;font-weight:700;line-height:1.15;}
.who-role{font-size:11px;color:var(--text-muted);}
.switch-user{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);
  padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--text-muted);}
.switch-user:hover{border-color:var(--primary);color:var(--primary);}
.prop-select{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);
  padding:7px 10px;font-size:12.5px;font-weight:700;color:var(--text);max-width:220px;}

.content{padding:22px;max-width:1180px;width:100%;margin:0 auto;}

/* ---------- Cards / KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.kpi-label{font-size:12px;color:var(--text-muted);font-weight:700;display:flex;align-items:center;gap:6px;}
.kpi-value{font-family:var(--mono);font-size:23px;font-weight:700;margin-top:6px;}
.kpi-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.kpi.warn .kpi-value{color:var(--warning);}
.kpi.bad .kpi-value{color:var(--danger);}
.kpi.good .kpi-value{color:var(--success);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;}
.card-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.card-head h3{font-size:15px;}
.card-head .desc{font-size:12px;color:var(--text-muted);margin-top:2px;}
.card-body{padding:14px 16px;}
.card-body.flush{padding:0;}

/* ---------- Table ---------- */
.tbl-wrap{overflow-x:auto;}
table.grid{width:100%;font-size:13.5px;}
table.grid th{text-align:left;background:var(--surface-2);color:var(--text-muted);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.3px;font-weight:800;padding:9px 12px;white-space:nowrap;}
table.grid td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle;}
table.grid tbody tr:hover{background:var(--surface-2);}
.num{font-family:var(--mono);text-align:right;white-space:nowrap;}
.center{text-align:center;}
.empty-row{padding:26px;text-align:center;color:var(--text-muted);font-size:13px;}

/* ---------- Badges / pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap;}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
.pill.ok{background:var(--success-soft);color:var(--success);}
.pill.warn{background:var(--warning-soft);color:var(--warning);}
.pill.bad{background:var(--danger-soft);color:var(--danger);}
.pill.muted{background:var(--surface-2);color:var(--text-muted);}
.pill.info{background:var(--primary-soft);color:var(--primary-strong);}
.room-status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px;}
.room-status-btn{border:none;border-radius:12px;padding:12px 10px;text-align:left;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;gap:4px;transition:filter .12s;}
.room-status-btn:hover{filter:brightness(0.96);}
.room-status-btn:disabled{cursor:default;}
.room-status-btn .rs-room{font-weight:800;font-size:14px;}
.room-status-btn .rs-tenant{font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.room-status-btn .rs-status{font-size:11px;font-weight:800;margin-top:2px;}
.room-status-btn.st-ok{background:var(--success-soft);color:var(--success);}
.room-status-btn.st-warn{background:var(--warning-soft);color:var(--warning);}
.room-status-btn.st-bad{background:var(--danger-soft);color:var(--danger);}
.room-status-btn.st-muted{background:var(--surface-2);color:var(--text-muted);}
.role-chip{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--surface-3);color:var(--text-muted);}
.role-chip.STAFF{background:var(--primary-soft);color:var(--primary-strong);}
.role-chip.ADMIN{background:var(--accent-soft);color:var(--accent);}
.role-chip.OWNER{background:var(--danger-soft);color:var(--danger);}

/* ---------- Buttons ---------- */
.btn{border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-size:13px;font-weight:700;padding:8px 14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn:hover{border-color:var(--primary);color:var(--primary);}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn.primary:hover{background:var(--primary-strong);border-color:var(--primary-strong);color:#fff;}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn.danger:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-muted);padding:7px 9px;}
.btn.ghost:hover{background:var(--surface-2);color:var(--text);}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn[disabled]:hover{border-color:var(--border);color:var(--text);}

/* ---------- Forms ---------- */
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:5px;}
.field .hint{font-size:11px;color:var(--text-muted);margin-top:4px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 11px;font-size:13.5px;background:var(--bg);color:var(--text);}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field textarea{resize:vertical;min-height:60px;}
.radio-row{display:flex;gap:8px;flex-wrap:wrap;}
.radio-opt{border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--text-muted);}
.radio-opt input{margin:0;}
.radio-opt.checked{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,14,26,.5);display:flex;align-items:flex-start;
  justify-content:center;padding:5vh 16px;z-index:100;overflow-y:auto;}
.modal{background:var(--surface);border-radius:var(--radius);max-width:560px;width:100%;box-shadow:var(--shadow);
  border:1px solid var(--border);margin-bottom:5vh;}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{font-size:16px;}
.modal-body{padding:18px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.close-x{border:none;background:none;color:var(--text-muted);font-size:18px;padding:4px 8px;border-radius:6px;}
.close-x:hover{background:var(--surface-2);color:var(--text);}

/* ---------- Alerts list ---------- */
.alert-row{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--border);align-items:flex-start;}
.alert-row:first-child{border-top:none;}
.alert-stripe{width:4px;align-self:stretch;border-radius:3px;flex:none;}
.alert-row.crit .alert-stripe{background:var(--danger);}
.alert-row.warn .alert-stripe{background:var(--warning);}
.alert-title{font-size:13.5px;font-weight:700;}
.alert-detail{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
.alert-meta{font-size:11px;color:var(--text-muted);margin-top:4px;font-family:var(--mono);}

/* ---------- Toast ---------- */
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{background:var(--text);color:var(--bg);padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;
  box-shadow:var(--shadow);max-width:320px;animation:toastin .15s ease-out;}
.toast.err{background:var(--danger);color:#fff;}
.toast.ok{background:var(--success);color:#fff;}
.toast.warn{background:var(--warning);color:#fff;}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Login screen ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
  padding:32px;max-width:420px;width:100%;}
.login-logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(155deg,var(--primary),var(--primary-strong));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;margin-bottom:14px;}
.staff-pick{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.staff-opt{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 12px;background:var(--surface);text-align:left;width:100%;}
.staff-opt:hover{border-color:var(--primary);background:var(--primary-soft);}
.staff-opt .who-avatar{width:30px;height:30px;font-size:12px;}

/* ---------- Misc ---------- */
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.section-title h2{font-size:19px;}
.section-title .desc{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;}
.hidden{display:none!important;}
.photo-thumb{width:44px;height:44px;border-radius:7px;object-fit:cover;border:1px solid var(--border);background:var(--surface-2);cursor:zoom-in;}
.help-box{background:var(--primary-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--text-muted);margin-bottom:14px;}
.divider{height:1px;background:var(--border);margin:14px 0;}
.link-btn{background:none;border:none;color:var(--primary);font-weight:700;font-size:12.5px;padding:0;}
.footnote{font-size:11px;color:var(--text-muted);margin-top:10px;}
.prop-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;display:flex;align-items:center;gap:12px;background:var(--surface);}
.prop-card + .prop-card{margin-top:8px;}

/* ---------- Meter room cards ---------- */
.meter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;align-items:start;}
.meter-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);}
.meter-card-room{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.meter-type-block{padding:12px 16px;border-top:1px solid var(--border);}
.meter-type-block:first-of-type{border-top:none;}
.meter-type-name{font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;
  display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.meter-fields{display:flex;flex-wrap:wrap;gap:16px 22px;align-items:flex-end;margin-bottom:9px;}
.mf{display:flex;flex-direction:column;gap:3px;}
.mf-label{font-size:10.5px;color:var(--text-muted);font-weight:700;}
.mf-value{font-family:var(--mono);font-size:15px;font-weight:700;}
.mf-sub{font-size:10px;color:var(--text-muted);font-weight:600;}
.meter-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.meter-skip-note{font-size:12px;color:var(--text-muted);}
.prop-code{width:44px;height:44px;border-radius:9px;background:var(--primary-soft);color:var(--primary-strong);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;font-family:var(--mono);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
</style>

(function(){
"use strict";

/* ---------------- generic helpers ---------------- */
const $ = (sel,root)=> (root||document).querySelector(sel);
const $all = (sel,root)=> Array.from((root||document).querySelectorAll(sel));
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
const THB = new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
function money(n){ return THB.format(Number(n||0)); }
function fmtDateTime(iso){ if(!iso) return '-'; try{ return new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short'}).format(new Date(iso)); }catch(e){ return iso; } }
function fmtDate(iso){ if(!iso) return '-'; try{ return new Intl.DateTimeFormat('th-TH',{dateStyle:'medium'}).format(new Date(iso)); }catch(e){ return iso; } }
function nowIso(){ return new Date().toISOString(); }
function currentPeriod(){ const d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0'); }
function periodLabel(p){ if(!p||p.length!==6) return p||'-'; const y=p.slice(0,4), m=parseInt(p.slice(4,6),10);
  const names=['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  return (names[m]||m)+' '+y; }
function toast(msg,kind){ const el=document.createElement('div'); el.className='toast'+(kind?' '+kind:''); el.textContent=msg;
  document.getElementById('toasts').appendChild(el); setTimeout(()=>{ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),250); },3200); }
function initials(name){ if(!name) return '?'; const parts=String(name).trim().split(/\s+/); return (parts[0][0]||'')+((parts[1]&&parts[1][0])||''); }
async function hashPassword(plain){
  try{
    const data = new TextEncoder().encode('kumho-salt-v1:'+plain);
    const digest = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    // fallback for environments without SubtleCrypto (very old/insecure contexts) - not cryptographically strong
    let h = 0; const s = 'kumho-salt-v1:'+plain;
    for(let i=0;i<s.length;i++){ h = ((h<<5)-h+s.charCodeAt(i))|0; }
    return 'fallback:'+h;
  }
}
function normalizeUsername(u){ return String(u||'').trim().toLowerCase(); }

/* ---------------- constants ---------------- */
const ROLE_LABEL = { STAFF:'พนักงาน', ADMIN:'ผู้ดูแลระบบ', OWNER:'เจ้าของกิจการ' };
const ROOM_STATUS_LABEL = { OCCUPIED:'มีผู้เช่า', VACANT:'ห้องว่าง', MAINTENANCE:'ปิดซ่อมบำรุง', RESERVED:'จองแล้ว' };
const RESERVATION_STATUS_LABEL = { PENDING:'รอเข้าพัก', CONVERTED:'เข้าพักแล้ว', CANCELLED:'ยกเลิกการจอง' };
const METER_TYPE_LABEL = { water:'น้ำประปา', elec:'ไฟฟ้า' };
const ROOM_TYPE_LABEL = { AC:'แอร์', FAN:'พัดลม' };
const WATER_MODE_LABEL = { SEPARATE:'แยกค่าน้ำ', INCLUSIVE:'รวมค่าเช่า', FLAT:'เหมาจ่าย' };
const ELEC_MODE_LABEL = { SEPARATE:'แยกค่าไฟ', INCLUSIVE:'รวมค่าเช่า' };
const LEDGER_TYPE_LABEL = { EXPENSE:'ค่าใช้จ่าย', INCOME:'รายได้อื่น' };
/* Legacy rows (and every repair-cost auto-entry) have no `type` field — treat as EXPENSE. */
function expenseType(e){ return e && e.type==='INCOME' ? 'INCOME' : 'EXPENSE'; }
/* room.waterMode: SEPARATE|INCLUSIVE|FLAT (water only) — room.elecMode: SEPARATE|INCLUSIVE.
   Falls back to the legacy combined room.billingMode field for rooms created before this split. */
function roomWaterMode(room){ if(!room) return 'SEPARATE'; return room.waterMode || room.billingMode || 'SEPARATE'; }
function roomElecMode(room){ if(!room) return 'SEPARATE'; const m = room.elecMode || room.billingMode || 'SEPARATE'; return m==='FLAT' ? 'SEPARATE' : m; }
function roomWaterFlatFee(room){ return (room && room.waterFlatFee!=null) ? Number(room.waterFlatFee) : 100; }
const APPROVAL_TYPE_LABEL = {
  VOID_PAYMENT:'ยกเลิกการรับชำระเงิน', REFUND:'คืนเงิน', INVOICE_CANCEL:'ยกเลิกใบแจ้งหนี้',
  DEBT_WAIVER:'ยกหนี้/ยกเว้นหนี้', DISCOUNT:'ขออนุมัติส่วนลด'
};
const METHOD_LABEL = { cash:'เงินสด', transfer:'โอนธนาคาร', qr:'QR พร้อมเพย์' };

/* ============================================================
   DATA LAYER — Supabase (Postgres + Auth + Realtime)
   - Documents live in table km_docs(collection, id, data jsonb)
   - Staff accounts live in km_staff (managed only through the km-admin edge function)
   - Login = username + password (no email / no OTP). Username is mapped to an internal address.
   ============================================================ */
const SUPABASE_URL = 'https://lgtgojdetusrkzlivfsr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_TbThH45vHcl8USudP5f-zQ_oth2-oEe';
const USER_DOMAIN = 'kumho.example.com';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true, storageKey:'kumho-supabase-auth' }
});
let authUserId = null;
let loginNotice = '';
let sampleApi = null; // AI meter OCR was an Artifact-only feature; disabled in the standalone app
function initSample(){}
function usernameToEmail(u){ return normalizeUsername(u)+'@'+USER_DOMAIN; }
function friendlyDbError(err){
  const m = (err && err.message) || String(err||'');
  if(/row-level security|permission denied|violates row/i.test(m)) return 'คุณไม่มีสิทธิ์ทำรายการนี้';
  if(/Failed to fetch|NetworkError|network/i.test(m)) return 'เชื่อมต่ออินเทอร์เน็ตไม่ได้ กรุณาลองใหม่';
  return m;
}
function staffRowToDoc(r){
  return { name:r.name, phone:r.phone||'', role:r.role, username:r.username, active:r.active, createdAt:r.created_at };
}

const Store = {
  cols:{}, listeners:{}, loaded:{}, channel:null, started:false,
  ensure(p){ if(!this.cols[p]) this.cols[p]=new Map(); if(!this.listeners[p]) this.listeners[p]=new Set(); return this.cols[p]; },
  arr(p){ return Array.from(this.ensure(p).entries()).map(([id,d])=>({id, ...d})); },
  notify(p){ this.ensure(p); const a=this.arr(p); this.listeners[p].forEach(cb=>{ try{ cb(a); }catch(e){ console.error(e); } }); },
  onCollection(p, cb){
    this.ensure(p); this.listeners[p].add(cb);
    if(this.loaded[p]) cb(this.arr(p));
    return ()=>this.listeners[p].delete(cb);
  },
  reset(){
    if(this.channel){ try{ sb.removeChannel(this.channel); }catch(e){} }
    this.channel=null; this.started=false; this.cols={}; this.listeners={}; this.loaded={};
    COLLECTIONS.forEach(n=>{ cache[n]=[]; }); cache.config={}; cache.ready={};
  },
  async fetchDocs(p){
    const out = new Map(); const size = 200; let from = 0;
    for(;;){
      const { data, error } = await sb.from('km_docs').select('id,data').eq('collection', p).order('id').range(from, from+size-1);
      if(error) throw error;
      data.forEach(r=>out.set(r.id, r.data||{}));
      if(data.length < size) break;
      from += size;
    }
    return out;
  },
  async loadStaff(){
    const { data, error } = await sb.from('km_staff').select('*').order('created_at');
    if(error) throw error;
    const m = new Map(); data.forEach(r=>m.set(r.id, staffRowToDoc(r)));
    this.cols.staff = m; this.ensure('staff'); this.loaded.staff = true; this.notify('staff');
  },
  async loadDocs(p){
    try{
      this.cols[p] = await this.fetchDocs(p); this.ensure(p);
    }catch(e){ console.error('load', p, e); this.ensure(p); }
    this.loaded[p] = true; this.notify(p);
  },
  async start(){
    if(this.started) return; this.started = true;
    const ch = sb.channel('km-live');
    ch.on('postgres_changes', {event:'*', schema:'public', table:'km_docs'}, p=>this.onDocEvent(p));
    ch.on('postgres_changes', {event:'*', schema:'public', table:'km_staff'}, ()=>this.loadStaff().catch(console.error));
    ch.subscribe();
    this.channel = ch;
    await this.loadStaff();
    COLLECTIONS.filter(n=>n!=='staff').concat(['config']).forEach(n=>{ this.loadDocs(n); });
  },
  async onDocEvent(p){
    try{
      const rec = p.eventType==='DELETE' ? p.old : p.new;
      if(!rec || !rec.collection || !this.loaded[rec.collection]) return;
      const col = this.ensure(rec.collection);
      if(p.eventType==='DELETE'){ col.delete(rec.id); }
      else if(p.errors || rec.data===undefined){
        const { data } = await sb.from('km_docs').select('data').eq('collection',rec.collection).eq('id',rec.id).maybeSingle();
        if(data) col.set(rec.id, data.data||{});
      } else col.set(rec.id, rec.data||{});
      this.notify(rec.collection);
    }catch(e){ console.error(e); }
  },
  async add(path, data){
    const id = uid();
    const { error } = await sb.from('km_docs').insert({collection:path, id, data});
    if(error) throw new Error(friendlyDbError(error));
    this.ensure(path).set(id, {...data}); this.notify(path);
    return id;
  },
  async set(path, id, data){
    const { error } = await sb.from('km_docs').upsert({collection:path, id, data, updated_at:nowIso()});
    if(error) throw new Error(friendlyDbError(error));
    this.ensure(path).set(id, {...data}); this.notify(path);
  },
  async update(path, id, patch){
    const { data, error } = await sb.rpc('km_merge', {p_collection:path, p_id:id, p_patch:patch});
    if(error) throw new Error(friendlyDbError(error));
    this.ensure(path).set(id, data||{}); this.notify(path);
  },
  async remove(path, id){
    const { error } = await sb.from('km_docs').delete().eq('collection',path).eq('id',id);
    if(error) throw new Error(friendlyDbError(error));
    this.ensure(path).delete(id); this.notify(path);
  },
  async getAll(path){ return this.arr(path); },
  async getOne(path, id){ const d = this.ensure(path).get(id); return d ? {id, ...d} : null; },
  // atomic running number (Postgres function — safe with many users at once)
  async increment(path, id){
    const { data, error } = await sb.rpc('km_increment', {p_collection:path, p_id:id});
    if(error) throw new Error(friendlyDbError(error));
    return data;
  }
};

/* ============================================================
   CACHE — subscribed collections kept in memory for fast render
   ============================================================ */
const cache = {
  staff:[], properties:[], rooms:[], tenants:[], leases:[], meterReadings:[], invoices:[],
  payments:[], approvals:[], auditLog:[], reservations:[], repairRequests:[], expenses:[], config:{}, ready:{}
};
const COLLECTIONS = ['staff','properties','rooms','tenants','leases','meterReadings','invoices','payments','approvals','auditLog','reservations','repairRequests','expenses'];

function subscribeAll(){
  COLLECTIONS.forEach(name=>{
    Store.onCollection(name, arr=>{
      cache[name] = arr;
      cache.ready[name] = true;
      route();
    });
  });
  Store.onCollection('config', arr=>{
    const bySettings = arr.find(d=>d.id==='settings');
    cache.config = bySettings || {};
    cache.ready.config = true;
    route();
  });
}

/* ---------------- permissions ---------------- */
function role(){ const u=Session.user; return u? u.role : null; }
function can(action){
  const r = role();
  const map = {
    RECORD_METER: ['STAFF','ADMIN','OWNER'],
    RECEIVE_PAYMENT: ['STAFF','ADMIN','OWNER'],
    CREATE_INVOICE: ['STAFF','ADMIN','OWNER'],
    MANAGE_ROOMS: ['ADMIN','OWNER'],       // day-to-day: status changes, lease binding
    MANAGE_PROPERTIES: ['ADMIN','OWNER'],  // structural: create/edit/delete dorms & rooms
    MANAGE_RESERVATIONS: ['STAFF','ADMIN','OWNER'],   // front-desk: book/confirm/cancel room bookings
    REVIEW_METER: ['ADMIN','OWNER'],
    APPROVE_SMALL_DISCOUNT: ['ADMIN','OWNER'],
    APPROVE_OWNER_ITEMS: ['OWNER'],      // void/refund/cancel/debt-waiver/large discount/reopen/rate change
    MANAGE_SETTINGS: ['OWNER'],
    MANAGE_STAFF: ['OWNER','ADMIN'],
    REPORT_REPAIR: ['STAFF','ADMIN','OWNER'],   // report a maintenance issue
    MANAGE_REPAIRS: ['ADMIN','OWNER'],          // close job + log repair cost
    ADD_EXPENSE: ['STAFF','ADMIN','OWNER'],     // log a new expense
    MANAGE_EXPENSES: ['ADMIN','OWNER'],         // edit/delete expense ledger entries
  };
  return !!(r && map[action] && map[action].includes(r));
}
function requireLogin(){ return !!Session.user; }
/* fine-grained staff-account management: Owner manages everyone (incl. Admin);
   Admin manages STAFF-role accounts only; neither role can act on their own account here (self uses profile edit). */
function canManageStaffTarget(target){
  const me = Session.user;
  if(!me || !target) return false;
  if(target.id===me.id) return false;
  if(me.role==='OWNER') return true;
  if(me.role==='ADMIN') return target.role!=='OWNER';
  return false;
}
function allowedRolesToAssign(){
  const me = Session.user;
  if(!me) return [];
  if(me.role==='OWNER') return ['STAFF','ADMIN','OWNER'];
  if(me.role==='ADMIN') return ['STAFF'];
  return [];
}
async function authenticateLogin(username, password){
  const uname = normalizeUsername(username);
  if(!uname) throw new Error('กรุณากรอกชื่อผู้ใช้');
  if(!password) throw new Error('กรุณากรอกรหัสผ่าน');
  const { data, error } = await sb.auth.signInWithPassword({ email: usernameToEmail(uname), password });
  if(error){
    if(/banned/i.test(error.message)) throw new Error('บัญชีนี้ถูกปิดใช้งาน กรุณาติดต่อผู้ดูแลระบบ');
    if(/fetch|network/i.test(error.message)) throw new Error('เชื่อมต่ออินเทอร์เน็ตไม่ได้ กรุณาลองใหม่');
    throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
  }
  authUserId = data.user.id;
  await startApp();
  const me = Session.user;
  if(!me){ await Session.clear(); throw new Error('บัญชีนี้ถูกปิดใช้งานหรือยังไม่ได้ตั้งค่าในระบบ กรุณาติดต่อผู้ดูแลระบบ'); }
  await logAudit({action:'LOGIN', entityType:'staff', entityId:me.id, newValue:{username:me.username}});
  return me;
}

function pastPeriods(current, n){
  const y = parseInt(current.slice(0,4),10), m = parseInt(current.slice(4,6),10);
  const out=[];
  for(let i=n-1;i>=0;i--){ let mm=m-i, yy=y; while(mm<=0){mm+=12; yy--;} out.push(yy+String(mm).padStart(2,'0')); }
  return out;
}
function periodTimestamp(period){ const y=+period.slice(0,4), m=+period.slice(4,6); return new Date(y, m-1, 5, 9, 30).toISOString(); }

async function createReservation({roomId, tenantName, phone, moveInDate, depositAmount, note, depositSlipDataUrl}){
  const room = roomById(roomId);
  if(!room) throw new Error('กรุณาเลือกห้องที่ว่าง');
  if(room.status!=='VACANT') throw new Error('จองล่วงหน้าได้เฉพาะห้องว่างเท่านั้น');
  if(!tenantName || !tenantName.trim()) throw new Error('ต้องระบุชื่อ-สกุลผู้จอง');
  if(!phone || !phone.trim()) throw new Error('ต้องระบุเบอร์โทร');
  if(!moveInDate) throw new Error('ต้องระบุวันที่จะเข้าพัก');
  const dep = Number(depositAmount);
  if(isNaN(dep) || dep<=0) throw new Error('ต้องระบุเงินมัดจำ');
  if(!depositSlipDataUrl) throw new Error('ต้องแนบรูปหลักฐานการโอนเงินมัดจำ');
  const prop = propertyById(room.propertyId);
  const id = await Store.add('reservations', {
    propertyId: room.propertyId, propertyCode: prop? prop.code:'', roomId, roomCode: room.code,
    tenantName: tenantName.trim(), phone:phone.trim(), moveInDate, depositAmount: dep,
    depositSlipDataUrl, note:(note||'').trim(), status:'PENDING', createdBy: Session.user.id, createdByName: Session.user.name, createdAt: nowIso()
  });
  await Store.update('rooms', roomId, {status:'RESERVED'});
  await logAudit({action:'CREATE_RESERVATION', entityType:'reservation', entityId:id, newValue:{roomCode:room.code, tenantName, moveInDate, depositAmount:dep}});
  toast('จองห้อง '+room.code+' ให้ '+tenantName+' แล้ว','ok');
}

/* ---- meter readings ---- */
function latestReadingFor(roomId, type, beforePeriod){
  const rows = cache.meterReadings.filter(r=>r.roomId===roomId && r.type===type && (!beforePeriod || r.period<beforePeriod));
  rows.sort((a,b)=> a.period<b.period?1:-1);
  return rows[0]||null;
}
function readingFor(roomId, type, period){
  return cache.meterReadings.find(r=>r.roomId===roomId && r.type===type && r.period===period) || null;
}
async function recordMeterReading({roomId, roomCode, type, value, period, photoDataUrl}){
  const existing = readingFor(roomId, type, period);
  if(existing && existing.locked){
    throw new Error('งวดนี้ออกใบแจ้งหนี้ไปแล้ว ต้องแก้ไขผ่านช่องทางแก้ไขพร้อมเหตุผลเท่านั้น');
  }
  const prevReading = latestReadingFor(roomId, type, period);
  const previousValue = prevReading? prevReading.value : 0;
  if(value < previousValue && Session.user.role==='STAFF'){
    throw new Error('ค่าที่จด ('+value+') ต่ำกว่าค่าก่อนหน้า ('+previousValue+') — ตรวจตัวเลขอีกครั้ง ถ้ามิเตอร์ถูกเปลี่ยน/วนรอบให้ผู้ดูแลระบบเป็นผู้บันทึก');
  }
  const usage = Math.max(0, value - previousValue);
  const payload = {
    roomId, roomCode, type, period, value, previousValue, usage, photoDataUrl: photoDataUrl||'',
    recordedBy: Session.user.id, recordedByName: Session.user.name, timestamp: nowIso(),
    verificationStatus:'pending', locked:false, editLog: existing? (existing.editLog||[]) : []
  };
  if(existing){
    await Store.update('meterReadings', existing.id, payload);
    await logAudit({action:'UPDATE_METER_READING', entityType:'meterReading', entityId:existing.id, oldValue:{value:existing.value}, newValue:{value}});
  } else {
    const id = await Store.add('meterReadings', payload);
    await logAudit({action:'CREATE_METER_READING', entityType:'meterReading', entityId:id, newValue:payload});
  }
  toast('บันทึกค่ามิเตอร์ห้อง '+roomCode+' ('+METER_TYPE_LABEL[type]+') แล้ว','ok');
}
async function editLockedReading(reading, newValue, reason){
  if(!reason || !reason.trim()) throw new Error('ต้องระบุเหตุผลในการแก้ไขค่ามิเตอร์ที่ถูกล็อกแล้ว');
  const entry = { reason: reason.trim(), oldValue: reading.value, newValue, editedBy: Session.user.name, editedByRole: Session.user.role, editedAt: nowIso() };
  const newUsage = Math.max(0, newValue - reading.previousValue);
  await Store.update('meterReadings', reading.id, { value:newValue, usage:newUsage, editLog:[...(reading.editLog||[]), entry] });
  await logAudit({action:'EDIT_LOCKED_METER_READING', entityType:'meterReading', entityId:reading.id, oldValue:{value:reading.value, reason:''}, newValue:{value:newValue, reason}});
  toast('แก้ไขค่ามิเตอร์ (พร้อมเหตุผล) แล้ว — บันทึกลง Audit Log','ok');
}
async function verifyReading(reading){

/* ---- invoices ---- */
function activeLeaseFor(roomId){ return cache.leases.find(l=>l.roomId===roomId && l.active); }
function tenantById(id){ return cache.tenants.find(t=>t.id===id) || null; }
function leaseDurationLabel(lease){
  if(!lease || !lease.startDate) return '-';
  const start = new Date(lease.startDate+'T00:00:00');
  const now = new Date(todayStr()+'T00:00:00');
  let months = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth());
  if(now.getDate() < start.getDate()) months -= 1;
  months = Math.max(0, months);
  const days = Math.max(0, Math.round((now-start)/86400000));
  if(months<1) return days+' วัน';
  const y = Math.floor(months/12), m = months%12;
  return (y>0? y+' ปี ':'')+m+' เดือน';
}
async function generateInvoice({roomId, roomCode, period, discount, discountReason}){
  if(cache.invoices.some(i=>i.roomId===roomId && i.period===period && i.status!=='cancelled')){
    throw new Error('ห้อง '+roomCode+' มีใบแจ้งหนี้งวด '+periodLabel(period)+' อยู่แล้ว');
  }
  const room = roomById(roomId);
  const prop = propertyById(room.propertyId);
  const lease = activeLeaseFor(roomId);
  const rent = lease? lease.rent : room.rent;
  const water = readingFor(roomId,'water',period);
  const elec = readingFor(roomId,'elec',period);
  const cfg = cache.config;
  if(roomWaterMode(room)==='SEPARATE' && !water) throw new Error('ห้อง '+roomCode+' ยังไม่ได้จดมิเตอร์น้ำงวด '+periodLabel(period)+' — ต้องจดมิเตอร์ก่อนออกใบแจ้งหนี้');
  if(roomElecMode(room)==='SEPARATE' && !elec) throw new Error('ห้อง '+roomCode+' ยังไม่ได้จดมิเตอร์ไฟงวด '+periodLabel(period)+' — ต้องจดมิเตอร์ก่อนออกใบแจ้งหนี้');
  const waterMode = roomWaterMode(room);
  const elecMode = roomElecMode(room);
  let waterAmount = 0;
  if(waterMode==='SEPARATE') waterAmount = water ? Math.round(water.usage*cfg.waterRate) : 0;
  else if(waterMode==='FLAT') waterAmount = roomWaterFlatFee(room);
  const elecAmount = (elecMode==='SEPARATE' && elec) ? Math.round(elec.usage*cfg.elecRate) : 0;
  const commonFee = Number(room.commonFee||0);
  discount = Number(discount||0);
  const total = Math.max(0, rent + waterAmount + elecAmount + commonFee - discount);

  let discountState = 'none';
  const r = Session.user.role;
  if(discount>0){
    if(r==='OWNER') discountState='approved';
    else if(r==='ADMIN') discountState = discount>cfg.discountApprovalThreshold ? 'pending' : 'approved';
    else discountState = 'pending';
  }
  const invSeq = await nextInvoiceSeq(room.propertyId, prop.code, period);
  const invId = await Store.add('invoices', {
    invoiceNumber: invSeq.label, invoiceSeq: invSeq.seq, propertyId: room.propertyId, propertyCode: prop.code,
    roomId, roomCode, period, waterMode, elecMode, rentAmount:rent,
    waterUnits: water?water.usage:0, waterAmount, elecUnits: elec?elec.usage:0, elecAmount, commonFee,
    discount, discountReason: discountReason||'', discountState, discountApprovedBy: discountState==='approved'? Session.user.name : '',
    total, status: discountState==='pending' ? 'pending_discount' : 'unpaid',
    createdAt: nowIso(), createdBy: Session.user.id, createdByName: Session.user.name,
    replacesInvoiceId:'', replacedByInvoiceId:''
  });
  if(water) await Store.update('meterReadings', water.id, {locked:true, invoiceId:invId});
  if(elec) await Store.update('meterReadings', elec.id, {locked:true, invoiceId:invId});
  if(discountState==='pending'){
    const approverRole = discount>cfg.discountApprovalThreshold ? 'OWNER' : 'ADMIN';
    await Store.add('approvals', {
      type:'DISCOUNT', entityType:'invoice', entityId:invId, roomCode, amount:discount,
      reason: discountReason||'', requestedBy: Session.user.id, requestedByName: Session.user.name,
      requiredRole: approverRole, status:'PENDING', requestedAt: nowIso()
    });
  }
  await logAudit({action:'CREATE_INVOICE', entityType:'invoice', entityId:invId, newValue:{roomCode,period,total,discount,invoiceNumber:invSeq.label}});
  toast('ออกใบแจ้งหนี้ '+invSeq.label+' ห้อง '+roomCode+' งวด '+periodLabel(period)+' แล้ว','ok');
}

async function recordPayment({invoice, amount, method, slipDataUrl}){
  if(!slipDataUrl) throw new Error('ต้องแนบหลักฐานการชำระเงิน (สลิป/รูปถ่าย) ก่อนจึงจะออกใบเสร็จได้');
  const room = roomById(invoice.roomId);
  const prop = propertyById(invoice.propertyId || room.propertyId);
  const seq = await nextReceiptSeq(prop.id, prop.code, invoice.period);
  // link to a prior voided receipt on this invoice, if one is awaiting replacement
  const pendingVoid = cache.payments.find(p=>p.invoiceId===invoice.id && p.status==='void' && !p.replacedByPaymentId);
  const paymentId = await Store.add('payments', {
    invoiceId: invoice.id, roomId:invoice.roomId, roomCode:invoice.roomCode, period:invoice.period,
    propertyId: prop.id, propertyCode: prop.code,
    amount:Number(amount), method, slipDataUrl, receivedBy:Session.user.id, receivedByName:Session.user.name,
    receivedAt: nowIso(), receiptNumber: seq.label, receiptSeq: seq.seq, status:'active',
    replacesPaymentId: pendingVoid? pendingVoid.id : '', replacedByPaymentId:''
  });
  if(pendingVoid) await Store.update('payments', pendingVoid.id, {replacedByPaymentId: paymentId});
  const paidSoFar = cache.payments.filter(p=>p.invoiceId===invoice.id && p.status==='active').reduce((s,p)=>s+p.amount,0) + Number(amount);
  await Store.update('invoices', invoice.id, {status: paidSoFar>=invoice.total? 'paid':'partial'});
  await logAudit({action:'RECORD_PAYMENT', entityType:'payment', entityId:paymentId, newValue:{amount,method,receiptNumber:seq.label}});
  toast('รับชำระเงินแล้ว — เลขที่ใบเสร็จ '+seq.label,'ok');
  return seq.label;
}

/* ---- approvals: maker / checker ---- */
async function resolveApproval(appr, decision /* 'APPROVED'|'REJECTED' */){
  if(appr.requestedBy === Session.user.id){
    throw new Error('ผู้ร้องขอห้ามอนุมัติรายการของตนเอง (Maker/Checker) — ต้องให้ผู้อื่นอนุมัติ');
  }
  const need = appr.requiredRole || 'OWNER';
  const rank = {STAFF:0,ADMIN:1,OWNER:2};
  if(rank[Session.user.role] < rank[need]){
    throw new Error('ต้องมีสิทธิ์ระดับ '+ROLE_LABEL[need]+' ขึ้นไปจึงจะอนุมัติรายการนี้ได้');
  }
  await Store.update('approvals', appr.id, {status:decision, approvedBy:Session.user.id, approvedByName:Session.user.name, approvedAt: nowIso()});
  if(decision==='APPROVED'){
    await applyApprovalEffect(appr);
  }
  await logAudit({action:'RESOLVE_APPROVAL_'+decision, entityType:'approval', entityId:appr.id, newValue:{type:appr.type, entityId:appr.entityId}});
  toast((decision==='APPROVED'?'อนุมัติ':'ปฏิเสธ')+'คำขอ: '+APPROVAL_TYPE_LABEL[appr.type], decision==='APPROVED'?'ok':undefined);
}
async function applyApprovalEffect(appr){
  if(appr.type==='VOID_PAYMENT'){
    const p = cache.payments.find(x=>x.id===appr.entityId); if(!p) return;
    await Store.update('payments', p.id, {status:'void', voidReason:appr.reason, voidRequestedBy:appr.requestedByName, voidApprovedBy:Session.user.name, voidedAt: nowIso()});
    const inv = cache.invoices.find(i=>i.id===p.invoiceId);
    if(inv){
      const paid = cache.payments.filter(x=>x.invoiceId===inv.id && x.status==='active' && x.id!==p.id).reduce((s,x)=>s+x.amount,0);
      await Store.update('invoices', inv.id, {status: paid<=0?'unpaid': (paid>=inv.total?'paid':'partial')});
    }
  } else if(appr.type==='REFUND'){
    const p = cache.payments.find(x=>x.id===appr.entityId); if(!p) return;
    await Store.update('payments', p.id, {status:'refunded', refundReason:appr.reason, refundApprovedBy:Session.user.name, refundedAt: nowIso()});
  } else if(appr.type==='INVOICE_CANCEL'){
    const inv = cache.invoices.find(x=>x.id===appr.entityId); if(!inv) return;
    await Store.update('invoices', inv.id, {status:'cancelled', cancelReason:appr.reason, cancelledBy:Session.user.name, cancelledAt: nowIso()});
  } else if(appr.type==='DEBT_WAIVER'){
    const inv = cache.invoices.find(x=>x.id===appr.entityId); if(!inv) return;
    await Store.update('invoices', inv.id, {status:'waived', waiveReason:appr.reason, waivedBy:Session.user.name, waivedAt: nowIso()});
  } else if(appr.type==='DISCOUNT'){
    const inv = cache.invoices.find(x=>x.id===appr.entityId); if(!inv) return;
    await Store.update('invoices', inv.id, {discountState:'approved', discountApprovedBy:Session.user.name, status:'unpaid'});
  }
}

async function createExpense({propertyId, date, item, amount, note, repairRequestId, type}){

  const amt = Number(amount);

/* ============================================================
   ANALYTICS — fraud alerts, risk scoring, reconciliation, number gaps
   ============================================================ */
function roomByCode(code){ return cache.rooms.find(r=>r.code===code); }
function roomById(id){ return cache.rooms.find(r=>r.id===id); }

function computeNumberGaps(list, seqField, labelField, propField, periodField){
  const byKey = {};
  list.forEach(item=>{ const k=item[propField]+'_'+item[periodField]; (byKey[k]=byKey[k]||[]).push(item); });
  const gaps = [];
  Object.keys(byKey).forEach(k=>{
    const rows = byKey[k].slice().sort((a,b)=>a[seqField]-b[seqField]);
    for(let i=1;i<rows.length;i++){
      if(rows[i][seqField]-rows[i-1][seqField] > 1){
        const prop = propertyById(rows[i][propField]);
        const period = rows[i][periodField];
        for(let missing=rows[i-1][seqField]+1; missing<rows[i][seqField]; missing++){
          gaps.push({ period, propertyId: rows[i][propField],
            label: labelField(prop? prop.code : '?', period, missing) });
        }
      }
    }
  });
  return gaps;
}
function computeReceiptGaps(){
  return computeNumberGaps(cache.payments.filter(p=>p.receiptSeq), 'receiptSeq', (code,period,n)=> code+'-'+period+'-'+String(n).padStart(4,'0'), 'propertyId', 'period');
}
function computeInvoiceGaps(){
  return computeNumberGaps(cache.invoices.filter(i=>i.invoiceSeq), 'invoiceSeq', (code,period,n)=> 'INV-'+code+'-'+period+'-'+String(n).padStart(4,'0'), 'propertyId', 'period');
}

function usageStatsFor(roomId, type, period){
  const all = cache.meterReadings.filter(r=>r.roomId===roomId && r.type===type && r.period<=period).sort((a,b)=> a.period<b.period?1:-1);
  const cur = all.find(r=>r.period===period);
  if(!cur) return null;
  const history = all.filter(r=>r.period<period);
  const avg = n => { const h=history.slice(0,n); return h.length? h.reduce((s,r)=>s+r.usage,0)/h.length : null; };
  const prevMonth = history[0]? history[0].usage : null;
  const avg3 = avg(3), avg6 = avg(6);
  function pctVs(base){ if(base===null || base===0) return null; return Math.round(((cur.usage-base)/base)*1000)/10; }
  return { cur, prevMonth, avg3, avg6, pctPrev:pctVs(prevMonth), pct3:pctVs(avg3), pct6:pctVs(avg6) };
}

function computeAlerts(){
  const alerts = [];
  const cfg = cache.config || {};
  const period = currentPeriod();
  const rooms = activeRooms();

  // 1) Vacant room with utility usage
  rooms.filter(r=>r.status==='VACANT').forEach(r=>{
    ['water','elec'].forEach(type=>{
      const cur = readingFor(r.id, type, period);
      if(cur && cur.usage > (cfg.vacantUsageThreshold||3)){
        const lastLease = cache.leases.filter(l=>l.roomId===r.id).sort((a,b)=> (b.endDate||'9999')<(a.endDate||'9999')?-1:1)[0];
        alerts.push({sev:'crit', type:'ห้องว่างมีการใช้น้ำ/ไฟ', room:r.code, propertyId:r.propertyId,
          title:'พบการใช้'+METER_TYPE_LABEL[type]+'ในห้องว่าง: '+r.code,
          detail:'มิเตอร์ก่อนหน้า '+cur.previousValue+' → ปัจจุบัน '+cur.value+' (ใช้ไป '+cur.usage+' หน่วย) · ผู้เช่ารายล่าสุด: '+(lastLease?lastLease.tenantName:'ไม่มีข้อมูล'),
          ref:{kind:'meterReading', id:cur.id}, points:30, target:{type:'room', id:r.id, label:r.code}});
      }
    });
  });

  // 2) Missing meter photos (current period)
  rooms.forEach(r=>{
    ['water','elec'].forEach(type=>{
      const cur = readingFor(r.id, type, period);
      if(cur && !cur.photoDataUrl){
        alerts.push({sev:'warn', type:'ไม่มีรูปมิเตอร์ประกอบ', room:r.code, propertyId:r.propertyId,
          title:'ไม่มีรูปมิเตอร์ประกอบ: '+r.code+' ('+METER_TYPE_LABEL[type]+')',
          detail:'บันทึกโดย '+cur.recordedByName+' เมื่อ '+fmtDateTime(cur.timestamp),
          ref:{kind:'meterReading', id:cur.id}, points:10, target:{type:'staff', id:cur.recordedBy, label:cur.recordedByName}});
      }
    });
  });

  // 2b) Monthly meter reading not recorded (every room, vacant or not)
  if(new Date().getDate() >= 3){
    const byProp = new Map();
    rooms.forEach(r=>['water','elec'].forEach(type=>{
      if(!meterRequired(r,type) || readingFor(r.id,type,period)) return;
      if(!byProp.has(r.propertyId)) byProp.set(r.propertyId, new Set());
      byProp.get(r.propertyId).add(r.code);
    }));
    byProp.forEach((codes,pid)=>{
      const p = propertyById(pid);
      const list = [...codes].sort((a,b)=>String(a).localeCompare(String(b),'en',{numeric:true}));
      alerts.push({sev: new Date().getDate()>=7 ? 'crit':'warn', type:'ยังไม่ได้จดมิเตอร์ประจำเดือน', room:list[0], propertyId:pid,
        title:'ยังไม่จดมิเตอร์งวด '+periodLabel(period)+(p?' · '+p.name:'')+': '+list.length+' ห้อง',
        detail:'ห้อง: '+list.slice(0,15).join(', ')+(list.length>15?' …':'')+' — ต้องจดมิเตอร์ทุกห้องต้นเดือน แม้ห้องว่างหรือไม่มีผู้เช่า',
        ref:{kind:'meterReading', id:''}, points:10, target:null});
    });
  }

  // 3) Meter reading edited
  cache.meterReadings.forEach(r=>{
    const room = roomById(r.roomId);
    (r.editLog||[]).forEach(e=>{
      alerts.push({sev:'warn', type:'มีการแก้ไขค่ามิเตอร์', room:r.roomCode, propertyId: room?room.propertyId:null,
        title:'แก้ไขค่ามิเตอร์: '+r.roomCode+' ('+METER_TYPE_LABEL[r.type]+')',
        detail:'เดิม '+e.oldValue+' → ใหม่ '+e.newValue+' · เหตุผล: '+e.reason+' · โดย '+e.editedBy,
        ref:{kind:'meterReading', id:r.id}, points:20, target:{type:'staff', id:null, label:e.editedBy}});
    });
  });

  // 4) Invoice cancelled
  cache.invoices.filter(i=>i.status==='cancelled').forEach(i=>{
    alerts.push({sev:'warn', type:'ใบแจ้งหนี้ถูกยกเลิก', room:i.roomCode, propertyId:i.propertyId,
      title:'ใบแจ้งหนี้ถูกยกเลิก: '+(i.invoiceNumber||i.roomCode)+' งวด '+periodLabel(i.period),
      detail:'เหตุผล: '+(i.cancelReason||'-')+' · อนุมัติโดย '+(i.cancelledBy||'-')+(i.replacedByInvoiceId?' · มีใบใหม่แทนแล้ว':' · ยังไม่มีใบใหม่แทน'),
      ref:{kind:'invoice', id:i.id}, points:0, target:null});
  });

  // 5) Payment voided
  cache.payments.filter(p=>p.status==='void').forEach(p=>{
    alerts.push({sev:'crit', type:'รายการชำระเงินถูกยกเลิก', room:p.roomCode, propertyId:p.propertyId,
      title:'ใบเสร็จถูกยกเลิก: '+p.receiptNumber,
      detail:'จำนวน '+money(p.amount)+' บาท · เหตุผล: '+(p.voidReason||'-')+' · อนุมัติโดย '+(p.voidApprovedBy||'-')+(p.replacedByPaymentId?' · มีใบเสร็จใหม่แทนแล้ว':''),
      ref:{kind:'payment', id:p.id}, points:25, target:{type:'transaction', id:p.id, label:p.receiptNumber}});
  });

  // 8) Unusual discount
  cache.invoices.filter(i=>i.discount>0 && i.discount>(cfg.discountApprovalThreshold||100)).forEach(i=>{
    alerts.push({sev:'warn', type:'ส่วนลดผิดปกติ', room:i.roomCode, propertyId:i.propertyId,
      title:'ส่วนลดสูงกว่าเกณฑ์: '+i.roomCode+' งวด '+periodLabel(i.period),
      detail:'ส่วนลด '+money(i.discount)+' บาท (เกณฑ์ '+cfg.discountApprovalThreshold+' บาท) · สถานะอนุมัติ: '+(i.discountState||'-'),
      ref:{kind:'invoice', id:i.id}, points:20, target:{type:'transaction', id:i.id, label:i.roomCode}});
  });

  // 9) Unusual utility usage vs 3-month average
  rooms.forEach(r=>{
    ['water','elec'].forEach(type=>{
      const st = usageStatsFor(r.id, type, period);
      if(st && st.pct3!==null && Math.abs(st.pct3) > (cfg.anomalyPercent||50)){
        alerts.push({sev:'warn', type:'การใช้น้ำ/ไฟผิดปกติ', room:r.code, propertyId:r.propertyId,
          title: r.code+' '+METER_TYPE_LABEL[type]+' สูงกว่าค่าเฉลี่ย 3 เดือน '+st.pct3+'%',
          detail:'งวดนี้ใช้ '+st.cur.usage+' หน่วย · เฉลี่ย 3 เดือนก่อน '+ (st.avg3? st.avg3.toFixed(1):'-') +' หน่วย',
          ref:{kind:'meterReading', id:st.cur.id}, points:0, target:null});
      }
    });
  });

  // 10) Room without invoice
  rooms.filter(r=>r.status==='OCCUPIED').forEach(r=>{
    const hasInvoice = cache.invoices.some(i=>i.roomId===r.id && i.period===period && i.status!=='cancelled');
    if(!hasInvoice){
      alerts.push({sev:'warn', type:'ห้องไม่มีใบแจ้งหนี้', room:r.code, propertyId:r.propertyId,
        title:'ยังไม่มีใบแจ้งหนี้งวด '+periodLabel(period)+': '+r.code, detail:'ห้องมีสถานะ OCCUPIED แต่ยังไม่ออกใบแจ้งหนี้งวดปัจจุบัน',
        ref:{kind:'room', id:r.id}, points:0, target:null});
    }
  });

  // 11) Occupied room without active lease
  rooms.filter(r=>r.status==='OCCUPIED').forEach(r=>{
    if(!activeLeaseFor(r.id)){
      alerts.push({sev:'crit', type:'ห้องมีผู้เช่าแต่ไม่มีสัญญา', room:r.code, propertyId:r.propertyId,
        title:'ห้อง '+r.code+' สถานะ OCCUPIED แต่ไม่มีสัญญาที่ใช้งานอยู่', detail:'ตรวจสอบว่าผูกสัญญาผู้เช่าครบถ้วนหรือไม่',
        ref:{kind:'room', id:r.id}, points:0, target:null});
    }
  });

  // 12) Receipt number gap
  computeReceiptGaps().forEach(g=>{
    alerts.push({sev:'crit', type:'เลขที่ใบเสร็จขาดหาย', room:'-', propertyId:g.propertyId,
      title:'เลขที่ใบเสร็จขาดหาย: '+g.label, detail:'งวด '+periodLabel(g.period)+' — ตรวจสอบว่าใบเสร็จนี้ถูก VOID อย่างถูกต้องหรือไม่',
      ref:{kind:'receiptGap', id:g.label}, points:0, target:null});
  });
  // 12b) Invoice number gap
  computeInvoiceGaps().forEach(g=>{
    alerts.push({sev:'crit', type:'เลขที่ใบแจ้งหนี้ขาดหาย', room:'-', propertyId:g.propertyId,
      title:'เลขที่ใบแจ้งหนี้ขาดหาย: '+g.label, detail:'งวด '+periodLabel(g.period)+' — ตรวจสอบว่าใบนี้ถูกยกเลิกอย่างถูกต้องหรือไม่',
      ref:{kind:'invoiceGap', id:g.label}, points:0, target:null});
  });

  const order = {crit:0, warn:1};
  alerts.sort((a,b)=> order[a.sev]-order[b.sev]);
  return alerts;
}

function periodOfDate(dateStr){ return (dateStr||'').slice(0,4)+(dateStr||'').slice(5,7); }
function monthsBetweenPeriods(p1,p2){
  const y1=+p1.slice(0,4), m1=+p1.slice(4,6), y2=+p2.slice(0,4), m2=+p2.slice(4,6);
  return (y2-y1)*12 + (m2-m1);
}
function computeOverdueInvoices(){
  const period = currentPeriod();
  const scopedRoomIds = new Set(scopedRooms().map(r=>r.id));
  return cache.invoices.filter(i=> ['unpaid','partial','pending_discount'].includes(i.status) && i.period<period && scopedRoomIds.has(i.roomId))
    .map(i=>{
      const paid = cache.payments.filter(p=>p.invoiceId===i.id && p.status==='active').reduce((s,p)=>s+p.amount,0);
      const outstanding = Math.max(0, i.total-paid);
      const lease = activeLeaseFor(i.roomId);
      return { invoice:i, outstanding, tenantName: lease? lease.tenantName : '(ไม่มีสัญญาปัจจุบัน)', monthsOverdue: monthsBetweenPeriods(i.period, period) };
    })
    .filter(x=>x.outstanding>0.005)
    .sort((a,b)=> b.monthsOverdue-a.monthsOverdue || b.outstanding-a.outstanding);
}
function computePropertyOverview(){
  const period = currentPeriod();
  const props = selectedPropertyId==='ALL' ? activeProperties() : activeProperties().filter(p=>p.id===selectedPropertyId);
  return props.map(p=>{
    const rooms = activeRooms().filter(r=>r.propertyId===p.id);
    const occ = rooms.filter(r=>r.status==='OCCUPIED').length;
    const vac = rooms.filter(r=>r.status==='VACANT').length;
    const maint = rooms.filter(r=>r.status==='MAINTENANCE').length;
    const reserved = rooms.filter(r=>r.status==='RESERVED').length;
    const collected = cache.payments.filter(pay=>pay.propertyId===p.id && pay.status==='active' && pay.period===period).reduce((s,x)=>s+x.amount,0);
    const outstanding = cache.invoices.filter(i=>i.propertyId===p.id && ['unpaid','partial','pending_discount'].includes(i.status))
      .reduce((s,i)=>{ const paid=cache.payments.filter(x=>x.invoiceId===i.id&&x.status==='active').reduce((a,x)=>a+x.amount,0); return s+Math.max(0,i.total-paid); },0);
    const ledgerThisPeriod = cache.expenses.filter(e=>e.propertyId===p.id && periodOfDate(e.date)===period);
    const expenses = ledgerThisPeriod.filter(e=>expenseType(e)==='EXPENSE').reduce((s,e)=>s+e.amount,0);
    const otherIncome = ledgerThisPeriod.filter(e=>expenseType(e)==='INCOME').reduce((s,e)=>s+e.amount,0);
    const netProfit = collected + otherIncome - expenses;
    return {property:p, total:rooms.length, occ, vac, maint, reserved, collected, outstanding, expenses, otherIncome, netProfit};
  });
}
function computeDailyControl(dateStr){
  const pays = cache.payments.filter(p=>p.status==='active' && (p.receivedAt||'').slice(0,10)===dateStr);
  const cash = pays.filter(p=>p.method==='cash').reduce((s,p)=>s+p.amount,0);
  const transfer = pays.filter(p=>p.method==='transfer').reduce((s,p)=>s+p.amount,0);
  const qr = pays.filter(p=>p.method==='qr').reduce((s,p)=>s+p.amount,0);
  const period = currentPeriod();
  const invIssued = cache.invoices.filter(i=>i.period===period).length;
  const invPaid = cache.invoices.filter(i=>i.period===period && i.status==='paid').length;
  const outstanding = cache.invoices.filter(i=>i.period===period && ['unpaid','partial','pending_discount'].includes(i.status))
    .reduce((s,i)=>{ const paid=cache.payments.filter(p=>p.invoiceId===i.id&&p.status==='active').reduce((a,p)=>a+p.amount,0); return s+Math.max(0,i.total-paid); },0);
  const voidsToday = cache.payments.filter(p=>p.status==='void' && (p.voidedAt||'').slice(0,10)===dateStr).length;
  const discountsToday = cache.invoices.filter(i=>i.discount>0 && (i.createdAt||'').slice(0,10)===dateStr).length;
  const refundsToday = cache.payments.filter(p=>p.status==='refunded' && (p.refundedAt||'').slice(0,10)===dateStr).length;
  return {cash,transfer,qr,total:cash+transfer+qr, invIssued, invPaid, outstanding, voidsToday, discountsToday, refundsToday};
}
function computeRoomPaymentStatus(){
  const period = currentPeriod();
  const day = new Date().getDate();
  return scopedRooms().filter(r=>r.status==='OCCUPIED').slice().sort((a,b)=>{
    if(a.propertyId!==b.propertyId){ const pa=propertyById(a.propertyId), pb=propertyById(b.propertyId);
      return (pa?pa.code:'')<(pb?pb.code:'')?-1:1; }
    return a.code<b.code?-1:1;
  }).map(r=>{
    const lease = activeLeaseFor(r.id);
    const inv = cache.invoices.find(i=>i.roomId===r.id && i.period===period && i.status!=='cancelled');
    let status;
    if(!inv) status = 'NONE';
    else if(inv.status==='paid') status = 'PAID';
    else if(inv.status==='waived') status = 'WAIVED';
    else status = (day<=5) ? 'DUE' : 'OVERDUE';
    return { room:r, lease, invoice:inv, status };
  });
}

function openModal({title, bodyHtml, submitLabel, onSubmit, wide}){
  const back = document.createElement('div'); back.className='modal-backdrop';
  back.innerHTML = '<div class="modal" style="'+(wide?'max-width:680px':'')+'">'+
    '<div class="modal-head"><h3>'+escapeHtml(title)+'</h3><button class="close-x" data-close>'+icon('x')+'</button></div>'+
    '<form id="modalForm"><div class="modal-body">'+bodyHtml+'</div>'+
    '<div class="modal-foot"><button type="button" class="btn" data-close>ยกเลิก</button>'+
    '<button type="submit" class="btn primary">'+escapeHtml(submitLabel||'บันทึก')+'</button></div></form></div>';
  document.body.appendChild(back);
  function close(){ back.remove(); }
  back.addEventListener('click', e=>{ if(e.target===back) close(); });
  $all('[data-close]', back).forEach(b=>b.addEventListener('click', close));
  const form = $('#modalForm', back);
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const submitBtn = $('button[type=submit]', form);
    submitBtn.disabled = true;
    try{
      await onSubmit(new FormData(form), back);
      close();
    }catch(err){
      toast(err.message || 'เกิดข้อผิดพลาด', 'err');
      submitBtn.disabled = false;
    }
  });
  return back;
}
function confirmModal({title, bodyHtml, danger, submitLabel, onSubmit}){
  return openModal({title, bodyHtml, submitLabel: submitLabel||'ยืนยัน', onSubmit});
}
function lightbox(src){
  const back = document.createElement('div'); back.className='modal-backdrop';
  back.innerHTML = '<div style="max-width:90vw;"><img src="'+src+'" style="max-width:100%;max-height:85vh;border-radius:10px;box-shadow:var(--shadow);"></div>';
  back.addEventListener('click', ()=>back.remove());
  document.body.appendChild(back);
}

/* ---- image compression for meter/slip photos ---- */
function compressImage(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{ img.onload = ()=>{
      const scale = Math.min(1, maxW/img.width);
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    }; img.onerror=reject; img.src = reader.result; };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function fileToCompressedDataUrl(file){
  if(!file) return '';
  let quality = 0.6, maxW = 480, out = await compressImage(file, maxW, quality);
  let guard = 0;
  while(out.length > 180000 && guard<5){ quality = Math.max(0.25, quality-0.15); maxW = Math.max(240, maxW-80); out = await compressImage(file, maxW, quality); guard++; }
  return out;
}

function navForRole(){ return role()==='STAFF' ? NAV.filter(n=>STAFF_ALLOWED_ROUTES.includes(n.id)) : NAV; }
function pendingApprovalsForMe(){

  return cache.approvals.filter(a=>a.status==='PENDING' && a.requestedBy!==Session.user.id &&
    ({STAFF:0,ADMIN:1,OWNER:2}[Session.user.role] >= {STAFF:0,ADMIN:1,OWNER:2}[a.requiredRole||'OWNER']));

function currentRoute(){ return (location.hash||'#dashboard').slice(1) || 'dashboard'; }
window.addEventListener('hashchange', route);

function route(){
  if(!authUserId){
    if(!document.getElementById('loginForm')) renderLogin(); // avoid wiping typed credentials on background cache refreshes
    return;
  }
  if(!Session.user){
    if(!cache.ready.staff){ renderLoading(); return; }
    loginNotice = 'บัญชีนี้ถูกปิดใช้งานหรือยังไม่ได้ตั้งค่าในระบบ กรุณาติดต่อผู้ดูแลระบบ';
    Session.clear().then(()=>route());
    return;
  }
  if(!allReady()){ renderLoading(); return; }
  const r = currentRoute();
  if(role()==='STAFF' && !STAFF_ALLOWED_ROUTES.includes(r)){ location.hash = '#dashboard'; return; }
  renderShell();
}

    '<p style="color:var(--text-muted);font-size:13px;">ระบบควบคุมภายในและป้องกันการทุจริต — เข้าสู่ระบบด้วยชื่อผู้ใช้และรหัสผ่านที่ได้รับจากผู้ดูแลระบบ/เจ้าของกิจการ</p>'+
    '<form id="loginForm" style="margin-top:14px;">'+

      '<div id="loginError" class="help-box" style="display:none;background:var(--danger-soft);border-color:var(--danger);color:var(--danger);margin-bottom:12px;"></div>'+
      '<button class="btn primary" type="submit" style="width:100%;">เข้าสู่ระบบ</button>'+
    '</form>'+
    '<p class="footnote">ยังไม่มีบัญชีผู้ใช้งาน? ติดต่อผู้ดูแลระบบหรือเจ้าของกิจการเพื่อขอให้สร้างบัญชีให้ (สร้างได้จากเมนู “ตั้งค่า”)</p>'+
    '</div></div>';
  const form = $('#loginForm');
  const err = $('#loginError');
  if(loginNotice){ err.textContent = loginNotice; err.style.display = 'block'; loginNotice = ''; }
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    err.style.display = 'none';
    const submitBtn = $('button[type=submit]', form);

  });

function navFor(ref){
  if(!ref) return 'dashboard';
  return {meterReading:'meters', invoice:'invoices', payment:'payments', room:'rooms', receiptGap:'payments', invoiceGap:'invoices', repairRequest:'repairs', expense:'expenses'}[ref.kind] || 'dashboard';
}
function kpi(label, cls, value, sub){
  return '<div class="kpi '+cls+'"><div class="kpi-label">'+label+'</div><div class="kpi-value">'+value+'</div><div class="kpi-sub">'+sub+'</div></div>';
}

function statusPill(status){
  const map = {OCCUPIED:'ok', VACANT:'muted', MAINTENANCE:'warn', RESERVED:'info'};
  return '<span class="pill '+map[status]+'">'+ROOM_STATUS_LABEL[status]+'</span>';
}

function usernameTaken(uname, excludeId){
  const n = normalizeUsername(uname);
  return cache.staff.some(x=>x.id!==excludeId && normalizeUsername(x.username)===n);
}
function openEditStaffModal(s){
  if(!canManageStaffTarget(s)){ toast('คุณไม่มีสิทธิ์แก้ไขบัญชีนี้','err'); return; }
  const assignable = allowedRolesToAssign();
  const roleOptions = Array.from(new Set([s.role, ...assignable]));
  openModal({title:'แก้ไขข้อมูลพนักงาน', submitLabel:'บันทึก', onSubmit: async fd=>{
    const name = fd.get('name').trim();
    if(!name) throw new Error('ต้องระบุชื่อ-นามสกุล');
    const username = fd.get('username').trim();
    if(!username) throw new Error('ต้องระบุชื่อผู้ใช้ (username)');
    if(usernameTaken(username, s.id)) throw new Error('มีชื่อผู้ใช้นี้อยู่แล้ว กรุณาใช้ชื่ออื่น');
    const newRole = fd.get('role');
    if(!roleOptions.includes(newRole)) throw new Error('คุณไม่มีสิทธิ์กำหนดบทบาทนี้');
    const patch = { name, phone:fd.get('phone').trim(), role:newRole, username };
    const newPassword = fd.get('newPassword');
    if(newPassword){ if(newPassword.length<6) throw new Error('รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร'); patch.password = newPassword; }
    await updateStaff(s, patch);
  }, bodyHtml:
    '<div class="field"><label>ชื่อ-นามสกุล</label><input name="name" required value="'+escapeHtml(s.name)+'"></div>'+
    '<div class="field"><label>เบอร์โทร</label><input name="phone" value="'+escapeHtml(s.phone||'')+'" placeholder="08x-xxx-xxxx"></div>'+
    '<div class="field"><label>ชื่อผู้ใช้ (username)</label><input name="username" required value="'+escapeHtml(s.username||'')+'"></div>'+
    '<div class="field"><label>ตั้งรหัสผ่านใหม่ (เว้นว่างถ้าไม่เปลี่ยน)</label><input name="newPassword" type="password" placeholder="เว้นว่างเพื่อคงรหัสผ่านเดิม"></div>'+
    '<div class="field"><label>บทบาท</label><select name="role">'+
      roleOptions.map(r=>'<option value="'+r+'" '+(r===s.role?'selected':'')+'>'+ROLE_LABEL[r]+'</option>').join('')+
    '</select></div>'});
}
/* Shared tenant-binding form used both from the room "+ ผูกผู้เช่า" action and from
   confirming a room booking. Requires name/address/phone plus ID-card and contract photo
   evidence — anti-fraud requirement. `onSubmit(data)` receives the assembled tenant data. */
function openBindTenantModal(room, {title, submitLabel, prefillName, prefillPhone, onSubmit}){
  openModal({title, submitLabel: submitLabel||'บันทึก', onSubmit: async fd=>{
    const name = (fd.get('name')||'').trim();
    const address = (fd.get('address')||'').trim();
    const phone = (fd.get('phone')||'').trim();
    if(!name) throw new Error('กรุณากรอกชื่อ-สกุลผู้เช่า');
    if(!address) throw new Error('กรุณากรอกที่อยู่ผู้เช่า');
    if(!phone) throw new Error('กรุณากรอกเบอร์โทรผู้เช่า');
    const idFile = fd.get('idCardPhoto');
    const contractFile = fd.get('contractPhoto');
    if(!idFile || !idFile.size) throw new Error('กรุณาแนบรูปถ่ายบัตรประชาชนผู้เช่า');
    if(!contractFile || !contractFile.size) throw new Error('กรุณาแนบรูปถ่ายสัญญาเช่า');
    const idCardPhotoUrl = await fileToCompressedDataUrl(idFile);
    const contractPhotoUrl = await fileToCompressedDataUrl(contractFile);
    await onSubmit({name, address, phone, rent:Number(fd.get('rent')), startDate:fd.get('startDate'), idCardPhotoUrl, contractPhotoUrl});
  }, bodyHtml:
    '<div class="field"><label>ชื่อ-สกุลผู้เช่า (*บังคับ)</label><input name="name" required value="'+escapeHtml(prefillName||'')+'"></div>'+
    '<div class="field"><label>ที่อยู่ (*บังคับ)</label><textarea name="address" required placeholder="ที่อยู่ตามบัตรประชาชนหรือที่อยู่ปัจจุบัน"></textarea></div>'+
    '<div class="field"><label>เบอร์โทร (*บังคับ)</label><input name="phone" required placeholder="08x-xxx-xxxx" value="'+escapeHtml(prefillPhone||'')+'"></div>'+
    '<div class="field-row"><div class="field"><label>ค่าเช่า (บาท) — ตามค่า default (แก้ไขได้)</label><input name="rent" type="number" required value="'+room.rent+'"></div>'+
    '<div class="field"><label>วันที่เข้าพัก</label><input name="startDate" type="date" required value="'+todayStr()+'"></div></div>'+
    '<div class="field"><label>รูปถ่ายบัตรประชาชน (*บังคับ)</label><input name="idCardPhoto" type="file" accept="image/*" capture="environment" required>'+
    '<p class="hint">'+icon('camera')+' ถ่ายรูปบัตรประชาชนผู้เช่าหรือแนบไฟล์รูป ระบบจะบีบอัดไฟล์อัตโนมัติ</p></div>'+
    '<div class="field"><label>รูปถ่ายสัญญาเช่า (*บังคับ)</label><input name="contractPhoto" type="file" accept="image/*" capture="environment" required>'+
    '<p class="hint">'+icon('camera')+' ถ่ายรูปสัญญาเช่าที่เซ็นแล้วหรือแนบไฟล์รูป ระบบจะบีบอัดไฟล์อัตโนมัติ</p></div>'});
}

    '<div class="field-row"><div class="field"><label>ค่าเช่าต่อเดือน (บาท)</label><input name="rent" type="number" min="0" required value="'+room.rent+'"></div>'+
    '<div class="field"><label>ค่าส่วนกลาง/เดือน (บาท)</label><input name="commonFee" type="number" min="0" value="'+(room.commonFee||0)+'"></div></div>'+
    '<p class="hint">การแก้ไขค่าเช่า/ค่าส่วนกลางที่นี่มีผลกับใบแจ้งหนี้งวดถัดไปเท่านั้น ไม่กระทบใบแจ้งหนี้ที่ออกไปแล้ว</p>'});
  const waterModeSel2 = $('#editRoomWaterMode', modalEl);
  const waterFlatField2 = $('#editRoomWaterFlatField', modalEl);
  function syncWaterFlat2(){ waterFlatField2.style.display = waterModeSel2.value==='FLAT' ? '' : 'none'; }
  if(waterModeSel2){ waterModeSel2.addEventListener('change', syncWaterFlat2); syncWaterFlat2(); }
}

/* ============================================================
   VIEW: ROOM BOOKINGS (การจองห้องพัก)
   ============================================================ */
function renderBookings(root){
  const scopedRoomIds = new Set(scopedRooms().map(r=>r.id));
  const all = cache.reservations.filter(rv=>scopedRoomIds.has(rv.roomId));
  const pending = all.filter(rv=>rv.status==='PENDING').slice().sort((a,b)=> (a.moveInDate||'')<(b.moveInDate||'')?-1:1);
  const history = all.filter(rv=>rv.status!=='PENDING').slice().sort((a,b)=> (b.createdAt||'')<(a.createdAt||'')?-1:1).slice(0,20);
  const vacantRoomsAny = activeRooms().filter(r=>r.status==='VACANT');

  root.innerHTML =
    '<div class="section-title"><div><h2>จองห้องพัก</h2><div class="desc">จองห้องว่างล่วงหน้าให้ผู้เช่าใหม่ พร้อมวันที่คาดว่าจะเข้าพัก — ยืนยันเข้าพักเพื่อสร้างสัญญาผู้เช่าให้อัตโนมัติ</div></div>'+
      (can('MANAGE_RESERVATIONS')? '<button class="btn primary" id="newBookingBtn"'+(vacantRoomsAny.length? '':' disabled')+'>'+icon('plus')+' จองห้องใหม่</button>':'')+'</div>'+
    (can('MANAGE_RESERVATIONS') && !vacantRoomsAny.length? '<div class="help-box">ไม่มีห้องว่างให้จองในระบบขณะนี้</div>':'')+
    '<div class="card"><div class="card-head"><h3>รอเข้าพัก ('+pending.length+')</h3></div><div class="card-body flush" id="pendingBookWrap"></div></div>'+
    '<div class="card"><div class="card-head"><h3>ประวัติการจอง</h3></div><div class="card-body flush" id="historyBookWrap"></div></div>';

  const pw = $('#pendingBookWrap');
  if(!pending.length){ pw.innerHTML = '<div class="empty-row">ยังไม่มีห้องที่จองไว้</div>'; }
  else pw.innerHTML = pending.map(rv=>{
    const prop = propertyById(rv.propertyId);
    const daysLeft = Math.round((new Date(rv.moveInDate)-new Date(todayStr()))/86400000);
    return '<div class="alert-row"><div class="alert-stripe" style="background:var(--primary);"></div><div style="flex:1;min-width:0;">'+
      '<div class="alert-title">ห้อง '+rv.roomCode+(prop?' · '+escapeHtml(prop.name):'')+' — '+escapeHtml(rv.tenantName)+'</div>'+
      '<div class="alert-detail">โทร '+escapeHtml(rv.phone||'-')+(rv.depositAmount? ' · มัดจำ '+money(rv.depositAmount)+' บาท':'')+(rv.note? ' · '+escapeHtml(rv.note):'')+'</div>'+
      '<div class="alert-meta">วันที่คาดว่าจะเข้าพัก: '+fmtDate(rv.moveInDate)+(daysLeft>=0? ' (อีก '+daysLeft+' วัน)' : ' (เลยกำหนด '+(-daysLeft)+' วัน)')+' · จองโดย '+escapeHtml(rv.createdByName)+'</div>'+
      (rv.depositSlipDataUrl? '<img class="photo-thumb" data-zoom="'+rv.depositSlipDataUrl+'" src="'+rv.depositSlipDataUrl+'" style="margin-top:6px;">' : '')+'</div>'+
      (can('MANAGE_RESERVATIONS')? '<div class="tag-row"><button class="btn sm primary" data-confirm="'+rv.id+'">ยืนยันเข้าพัก</button><button class="btn sm" data-cancelbook="'+rv.id+'">ยกเลิกการจอง</button></div>':'')+
      '</div>';
  }).join('');
  $all('[data-zoom]', pw).forEach(img=>img.addEventListener('click', ()=>lightbox(img.dataset.zoom)));
  $all('[data-confirm]', pw).forEach(b=>b.addEventListener('click', ()=>{
    const rv = cache.reservations.find(x=>x.id===b.dataset.confirm);
    const room = roomById(rv.roomId);
    openBindTenantModal(room, {title:'ยืนยันเข้าพักห้อง '+rv.roomCode, submitLabel:'ยืนยันเข้าพัก',
      prefillName:rv.tenantName, prefillPhone:rv.phone, onSubmit: async data=>{ await confirmMoveIn(rv, data); }});
  }));
  $all('[data-cancelbook]', pw).forEach(b=>b.addEventListener('click', ()=>{
    const rv = cache.reservations.find(x=>x.id===b.dataset.cancelbook);
    openModal({title:'ยกเลิกการจองห้อง '+rv.roomCode, submitLabel:'ยืนยันยกเลิก', onSubmit: async fd=>{ await cancelReservation(rv, fd.get('reason')); },
      bodyHtml:'<p>ห้องจะกลับเป็นห้องว่างทันที</p><div class="field"><label>เหตุผล (ถ้ามี)</label><textarea name="reason" placeholder="เช่น ผู้จองเปลี่ยนใจ"></textarea></div>'});
  }));

  const hw = $('#historyBookWrap');
  if(!history.length){ hw.innerHTML = '<div class="empty-row">ยังไม่มีประวัติการจอง</div>'; }
  else hw.innerHTML = history.map(rv=>
    '<div class="alert-row"><div style="flex:1;"><div class="alert-title">ห้อง '+rv.roomCode+' — '+escapeHtml(rv.tenantName)+'</div>'+
    '<div class="alert-detail">วันที่คาดว่าจะเข้าพัก '+fmtDate(rv.moveInDate)+(rv.status==='CANCELLED' && rv.cancelReason? ' · เหตุผลยกเลิก: '+escapeHtml(rv.cancelReason):'')+'</div></div>'+
    '<span class="pill '+(rv.status==='CONVERTED'?'ok':'muted')+'">'+RESERVATION_STATUS_LABEL[rv.status]+'</span></div>'
  ).join('');

  if($('#newBookingBtn')) $('#newBookingBtn').addEventListener('click', ()=>{
    const allVacant = activeRooms().filter(r=>r.status==='VACANT');
    const bookProps = activeProperties().filter(p=> allVacant.some(r=>r.propertyId===p.id));
    const defaultPropId = (selectedPropertyId!=='ALL' && bookProps.some(p=>p.id===selectedPropertyId)) ? selectedPropertyId : (bookProps[0]? bookProps[0].id : '');
    const roomsFor = pid => allVacant.filter(r=>r.propertyId===pid).slice().sort((a,b)=>a.code<b.code?-1:1);
    const modalEl = openModal({title:'จองห้องพักใหม่', submitLabel:'จองห้อง', onSubmit: async (fd)=>{
      const file = fd.get('depositSlip');
      let depositSlipDataUrl = '';
      if(file && file.size>0) depositSlipDataUrl = await fileToCompressedDataUrl(file);
      await createReservation({roomId:fd.get('roomId'), tenantName:fd.get('tenantName'), phone:fd.get('phone'),
        moveInDate:fd.get('moveInDate'), depositAmount:fd.get('depositAmount'), note:fd.get('note'), depositSlipDataUrl});
    }, bodyHtml:
      '<div class="field"><label>หอพัก</label><select name="propertyId" id="bookPropSel">'+bookProps.map(p=>
        '<option value="'+p.id+'" '+(p.id===defaultPropId?'selected':'')+'>'+escapeHtml(p.name)+' ('+p.code+')</option>').join('')+'</select></div>'+
      '<div class="field"><label>ห้องว่าง</label><select name="roomId" id="bookRoomSel" required></select></div>'+
      '<div class="field"><label>ชื่อ-สกุล ผู้จอง (*บังคับ)</label><input name="tenantName" required></div>'+
      '<div class="field"><label>เบอร์โทร (*บังคับ)</label><input name="phone" required placeholder="08x-xxx-xxxx"></div>'+
      '<div class="field-row"><div class="field"><label>วันที่จะเข้าพัก (*บังคับ)</label><input name="moveInDate" type="date" required value="'+todayStr()+'"></div>'+
      '<div class="field"><label>เงินมัดจำ (บาท) (*บังคับ)</label><input name="depositAmount" type="number" min="1" required></div></div>'+
      '<div class="field"><label>หมายเหตุ</label><input name="note" placeholder="ไม่บังคับ"></div>'+
      '<div class="field"><label>รูปหลักฐานการโอนเงินมัดจำ (*บังคับ)</label><input name="depositSlip" type="file" accept="image/*" capture="environment" required>'+
      '<p class="hint">'+icon('camera')+' ถ่ายรูปสลิปโอนเงินหรือแนบไฟล์รูปหลักฐาน ระบบจะบีบอัดไฟล์อัตโนมัติ</p></div>'});
    const propSel = $('#bookPropSel', modalEl);
    const roomSel = $('#bookRoomSel', modalEl);
    function fillRooms(){
      const list = propSel? roomsFor(propSel.value) : allVacant;
      roomSel.innerHTML = list.map(r=>'<option value="'+r.id+'">'+r.code+' ('+money(r.rent)+' บาท/เดือน)</option>').join('') ||
        '<option value="" disabled selected>ไม่มีห้องว่างในหอนี้</option>';
    }
    fillRooms();
    if(propSel) propSel.addEventListener('change', fillRooms);
  });
}
