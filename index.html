   VIEW: METER READINGS
   ============================================================ */
let meterPeriodSel = currentPeriod();
function renderMeters(root){
  const periods = pastPeriods(currentPeriod(), 6);
  if(!periods.includes(meterPeriodSel)) meterPeriodSel = currentPeriod();
  const props = activeProperties();
  if(selectedPropertyId!=='ALL' && !props.some(p=>p.id===selectedPropertyId)) selectedPropertyId='ALL';
  root.innerHTML =
    '<div class="section-title"><div><h2>มิเตอร์น้ำ-ไฟ</h2><div class="desc">ต้องมีหลักฐานรูปถ่ายทุกครั้ง ครอบคลุมห้องว่างและปิดซ่อมบำรุงด้วย (รวมถึงห้องที่คิดค่าน้ำ-ไฟรวมในค่าเช่า เพื่อตรวจจับการทุจริต) · แก้ไขหลังออกบิลต้องระบุเหตุผล</div></div>'+
      '<div class="tag-row">'+
      (props.length>1? '<select id="meterPropSel" class="btn sm"><option value="ALL" '+(selectedPropertyId==='ALL'?'selected':'')+'>ทุกหอพัก</option>'+
        props.map(p=>'<option value="'+p.id+'" '+(p.id===selectedPropertyId?'selected':'')+'>'+escapeHtml(p.name)+' ('+p.code+')</option>').join('')+'</select>' : '')+
      '<select id="periodSel" class="btn sm">'+periods.slice().reverse().map(p=>'<option value="'+p+'" '+(p===meterPeriodSel?'selected':'')+'>'+periodLabel(p)+'</option>').join('')+'</select>'+
      '</div></div>'+
    '<div class="help-box">ต้นรอบบิลของทุกงวด ต้องจดมิเตอร์ครบทุกห้องที่มีมิเตอร์ ไม่ว่าห้องจะว่างหรือปิดซ่อมบำรุงก็ตาม เพื่อให้ตรวจสอบย้อนกลับได้เสมอ</div>'+
    '<div id="meterSummary"></div><div class="meter-grid" id="metersBody"></div>';
  if($('#meterPropSel')) $('#meterPropSel').addEventListener('change', e=>{ selectedPropertyId = e.target.value; route(); });
  $('#periodSel').addEventListener('change', e=>{ meterPeriodSel = e.target.value; renderMeters(root); });
  renderMetersBody();
}
/* One card per room: row1 = room code, row2 = room status (same header line),
   row3 = water detail block, row4 = electricity detail block — each detail block
   shows ค่าก่อนหน้า/ค่าปัจจุบัน/ใช้ไป/รูปถ่าย, or a "no meter needed" note when the
   room's water/elec billing mode makes metering unnecessary for billing (still an
   anti-fraud control elsewhere, but nothing to record here). */
function meterNoBilling(room, type){
  const mode = type==='water' ? roomWaterMode(room) : roomElecMode(room);
  return {mode, noBilling: type==='water' ? (mode==='INCLUSIVE'||mode==='FLAT') : (mode==='INCLUSIVE')};
}
/* A meter point must be recorded every month (vacant or not, anti-fraud) when it drives billing,
   or when the room already has readings on file for it (e.g. PLOY electricity, even though rent is all-inclusive). */
function meterRequired(room, type){
  return !meterNoBilling(room, type).noBilling || cache.meterReadings.some(r=>r.roomId===room.id && r.type===type);
}
function meterTypeBlockHtml(room, type){
  const {mode, noBilling} = meterNoBilling(room, type);
  const typeLabel = METER_TYPE_LABEL[type];
  if(!meterRequired(room, type)){
    const note = mode==='FLAT' ? 'เหมาจ่าย '+money(roomWaterFlatFee(room))+' บาท/เดือน — ไม่ต้องจดมิเตอร์' : 'รวมค่าเช่า — ไม่ต้องจดมิเตอร์';
    return '<div class="meter-type-block"><div class="meter-type-name">'+typeLabel+'</div>'+
      '<div class="meter-skip-note"><span class="pill muted">'+note+'</span></div></div>';
  }
  const rd = readingFor(room.id, type, meterPeriodSel);
  const prevRd = latestReadingFor(room.id, type, meterPeriodSel);
  const prevVal = rd ? rd.previousValue : (prevRd ? prevRd.value : '-');
  const prevCap = prevRd ? '<span class="mf-sub">'+periodLabel(prevRd.period)+(prevRd.baseline?' · ค่าตั้งต้น':'')+'</span>' : '';
  return '<div class="meter-type-block"><div class="meter-type-name">'+typeLabel+
      (rd ? (rd.locked? ' <span class="pill info">ล็อกแล้ว (ออกบิลแล้ว)</span>' : (rd.verificationStatus==='verified'?' <span class="pill ok">ตรวจแล้ว</span>':' <span class="pill warn">รอตรวจสอบ</span>')) : ' <span class="pill bad">ยังไม่จด</span>')+
      (noBilling ? ' <span class="pill muted">'+(mode==='FLAT'?'เหมาจ่าย':'รวมค่าเช่า')+' · ไม่มีผลต่อบิล</span>' : '')+
      (rd && rd.editLog && rd.editLog.length? ' <span class="footnote" style="margin:0;">แก้ไข '+rd.editLog.length+' ครั้ง</span>':'')+
    '</div>'+
    '<div class="meter-fields">'+
      '<div class="mf"><span class="mf-label">ค่าก่อนหน้า</span><span class="mf-value">'+prevVal+'</span>'+prevCap+'</div>'+
      '<div class="mf"><span class="mf-label">ค่าปัจจุบัน</span><span class="mf-value">'+(rd? rd.value : '-')+'</span></div>'+
      '<div class="mf"><span class="mf-label">ใช้ไป</span><span class="mf-value">'+(rd? rd.usage : '-')+'</span></div>'+
      '<div class="mf"><span class="mf-label">รูปถ่าย</span>'+(rd && rd.photoDataUrl ? '<img class="photo-thumb" data-zoom="'+rd.photoDataUrl+'" src="'+rd.photoDataUrl+'">' : (rd? '<span class="pill bad">ไม่มีรูป</span>':'<span class="pill muted">-</span>'))+'</div>'+
    '</div>'+
    '<div class="meter-actions">'+
      (can('RECORD_METER') && (!rd || !rd.locked) ? '<button class="btn sm" data-record="'+room.id+'|'+type+'">'+(rd?'แก้ไข':icon('camera')+' ถ่ายรูป / จดมิเตอร์')+'</button>' : '')+
      (rd && rd.locked && can('MANAGE_ROOMS') ? '<button class="btn sm" data-editlock="'+rd.id+'">แก้ไข (ระบุเหตุผล)</button>' : '')+
      (rd && rd.verificationStatus!=='verified' && can('REVIEW_METER') ? '<button class="btn sm" data-verify="'+rd.id+'">ยืนยัน</button>' : '')+
    '</div>'+
  '</div>';
}
let meterOnlyMissing = false;
function renderMetersBody(){
  const body = $('#metersBody'); if(!body) return;
  const allRooms = scopedRooms().slice().sort((a,b)=>String(a.code).localeCompare(String(b.code),'en',{numeric:true}));
  if(!allRooms.length){ body.innerHTML = '<div class="card"><div class="empty-row">ยังไม่มีห้องพักในขอบเขตที่เลือก</div></div>'; return; }
  // monthly completeness check: every metered point of every room (vacant or occupied) must have this period's reading
  let reqN = 0, doneN = 0; const missByRoom = new Map();
  allRooms.forEach(r=>['water','elec'].forEach(t=>{
    if(!meterRequired(r,t)) return;
    reqN++;
    if(readingFor(r.id,t,meterPeriodSel)) doneN++;
    else { if(!missByRoom.has(r.id)) missByRoom.set(r.id, []); missByRoom.get(r.id).push(t==='water'?'น้ำ':'ไฟ'); }
  }));
  const missN = reqN - doneN;
  const sumEl = $('#meterSummary');
  if(sumEl){
    const names = allRooms.filter(r=>missByRoom.has(r.id)).map(r=>r.code+' ('+missByRoom.get(r.id).join('/')+')');
    sumEl.innerHTML = '<div class="help-box" style="'+(missN? 'background:var(--danger-soft);border-color:var(--danger);':'')+'">'+
      '<strong>งวด '+periodLabel(meterPeriodSel)+'</strong> · จดแล้ว <strong>'+doneN+'/'+reqN+'</strong> จุด'+
      (missN? ' · <strong style="color:var(--danger);">ยังไม่จด '+missN+' จุด</strong>: '+names.slice(0,12).join(', ')+(names.length>12?' และอีก '+(names.length-12)+' ห้อง':'') : ' · ครบทุกห้องแล้ว')+
      (missN? '<div style="margin-top:6px;"><label style="display:inline-flex;gap:6px;align-items:center;cursor:pointer;"><input type="checkbox" id="onlyMissing" '+(meterOnlyMissing?'checked':'')+'> แสดงเฉพาะห้องที่ยังไม่จด</label></div>':'')+
      '</div>';
    const cb = $('#onlyMissing'); if(cb) cb.addEventListener('change', ()=>{ meterOnlyMissing = cb.checked; renderMetersBody(); });
  }
  const rooms = (meterOnlyMissing && missN) ? allRooms.filter(r=>missByRoom.has(r.id)) : allRooms;
  body.innerHTML = rooms.map(r=>
    '<div class="card meter-card">'+
      '<div class="meter-card-head"><div class="meter-card-room">'+r.code+'</div>'+statusPill(r.status)+'</div>'+
      meterTypeBlockHtml(r, 'water')+
      meterTypeBlockHtml(r, 'elec')+
    '</div>'
  ).join('');
  $all('[data-zoom]', body).forEach(img=>img.addEventListener('click', ()=>lightbox(img.dataset.zoom)));
  $all('[data-record]', body).forEach(b=>b.addEventListener('click', ()=>{
    const [roomId,type] = b.dataset.record.split('|');
    openMeterModal(roomById(roomId), type, readingFor(roomId,type,meterPeriodSel));
  }));
  $all('[data-editlock]', body).forEach(b=>b.addEventListener('click', ()=>{
    const rd = cache.meterReadings.find(r=>r.id===b.dataset.editlock);
    openModal({title:'แก้ไขค่ามิเตอร์ที่ล็อกแล้ว: '+rd.roomCode+' ('+METER_TYPE_LABEL[rd.type]+')', onSubmit: async fd=>{
      await editLockedReading(rd, Number(fd.get('value')), fd.get('reason'));
    }, bodyHtml:
      '<div class="help-box">งวดนี้ออกใบแจ้งหนี้ไปแล้ว การแก้ไขจะถูกบันทึกค่าเดิม/ค่าใหม่/ผู้แก้ไข/เวลา ลง Audit Log แบบถาวร</div>'+
      '<div class="field"><label>ค่าเดิม</label><input value="'+rd.value+'" disabled></div>'+
      '<div class="field"><label>ค่าใหม่</label><input name="value" type="number" required value="'+rd.value+'"></div>'+
      '<div class="field"><label>เหตุผลการแก้ไข</label><textarea name="reason" required placeholder="เช่น จดตัวเลขผิดพลาด ตรวจพบภายหลัง"></textarea></div>'});
  }));
  $all('[data-verify]', body).forEach(b=>b.addEventListener('click', async ()=>{
    await verifyReading(cache.meterReadings.find(r=>r.id===b.dataset.verify));
  }));
}
let ocrPermanentlyHidden = false;
function openMeterModal(room, type, existing){
  const modalEl = openModal({title:(existing?'แก้ไข':'จดมิเตอร์')+' '+room.code+' — '+METER_TYPE_LABEL[type], onSubmit: async (fd)=>{
    const file = fd.get('photo');
    let photoDataUrl = existing? existing.photoDataUrl : '';
    if(file && file.size>0) photoDataUrl = await fileToCompressedDataUrl(file);
    await recordMeterReading({roomId:room.id, roomCode:room.code, type, value:Number(fd.get('value')), period:meterPeriodSel, photoDataUrl});
  }, bodyHtml:
    ((type==='water'&&roomWaterMode(room)==='FLAT')? '<div class="help-box">ห้องนี้คิดค่าน้ำแบบเหมาจ่าย ('+money(roomWaterFlatFee(room))+' บาท/เดือน) ยังคงต้องจดมิเตอร์เพื่อใช้ตรวจจับความผิดปกติ แม้จะไม่มีผลต่อยอดบิล</div>':'')+
    '<div class="field"><label>ค่ามิเตอร์ก่อนหน้า</label><input value="'+(existing? existing.previousValue : (latestReadingFor(room.id,type,meterPeriodSel)? latestReadingFor(room.id,type,meterPeriodSel).value : 0))+'" disabled></div>'+
    '<div class="field"><label>ค่ามิเตอร์ปัจจุบัน</label><input name="value" id="meterValueInput" type="number" required value="'+(existing? existing.value:'')+'"></div>'+
    '<div class="field"><label>รูปถ่ายมิเตอร์ '+(existing&&existing.photoDataUrl?'(มีรูปอยู่แล้ว — เลือกใหม่เพื่อแทนที่)':'(บังคับ)')+'</label>'+
    '<input name="photo" id="meterPhotoInput" type="file" accept="image/*" capture="environment" '+(existing&&existing.photoDataUrl?'':'required')+'>'+
    '<div id="ocrAssistWrap" style="margin-top:8px;"></div>'+
    '<p class="hint">'+icon('camera')+' รองรับถ่ายภาพจากกล้องมือถือโดยตรง ระบบจะบีบอัดไฟล์อัตโนมัติ</p></div>'});

  const ocrWrap = $('#ocrAssistWrap', modalEl);

            {images: [file]}
          );
          if(result && typeof result.value !== 'undefined' && !isNaN(Number(result.value))){
            valueInput.value = Math.round(Number(result.value));
            toast('อ่านค่ามิเตอร์อัตโนมัติแล้ว ('+valueInput.value+') — กรุณาตรวจสอบความถูกต้องก่อนบันทึก','ok');
          } else {
            toast('ระบบอ่านตัวเลขจากรูปไม่สำเร็จ กรุณากรอกด้วยตนเอง','warn');
          }
        }catch(err){
          const permanentHide = ['not_granted','images_unavailable','sampling_disabled','not_declared','capability_disabled','capability_removed','tools_unavailable'];
          if(err && permanentHide.includes(err.code)){ ocrPermanentlyHidden = true; btn.remove(); }
          else { toast('อ่านค่าอัตโนมัติไม่สำเร็จ กรุณากรอกด้วยตนเอง','warn'); }

          if(document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = label; }
        }
      });
    });

}

/* ---- แจ้งบิลเข้ากลุ่มไลน์ ---- */
const LineState = { ready:null, at:0, info:null };
async function lineStatus(force){
  if(!force && LineState.ready!==null && Date.now()-LineState.at<60000) return LineState.ready;
  try{ const r = await lineCall('status'); LineState.ready = !!r.ready; LineState.info = r; LineState.at = Date.now(); }
  catch(e){ LineState.ready = false; }
  return LineState.ready;
}
function lineChunks(text, max){
  max = max || 4500;
  const out = []; let cur = '';
  text.split('\n').forEach(line=>{
    while(line.length > max){ if(cur){ out.push(cur); cur=''; } out.push(line.slice(0,max)); line = line.slice(max); }
    if((cur ? cur.length+1 : 0) + line.length > max){ out.push(cur); cur = line; }
    else cur = cur ? cur+'\n'+line : line;
  });
  if(cur) out.push(cur);
  return out;
}
const lm = n=>{ n=Number(n||0); return Number.isInteger(n) ? n.toLocaleString('en-US') : n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
function invoiceBreakdown(i){
  const wMode = i.waterMode||i.billingMode, eMode = i.elecMode||i.billingMode;
  const parts = ['เช่า '+lm(i.rentAmount)];
  if(wMode!=='INCLUSIVE') parts.push('น้ำ '+lm(i.waterAmount)+(i.waterMode==='FLAT'?' (เหมา)':(i.waterUnits? ' ('+i.waterUnits+' หน่วย)':'')));
  if(eMode!=='INCLUSIVE') parts.push('ไฟ '+lm(i.elecAmount)+(i.elecUnits? ' ('+i.elecUnits+' หน่วย)':''));
  if(Number(i.commonFee||0)>0) parts.push('ส่วนกลาง '+lm(i.commonFee));
  if(Number(i.discount||0)>0) parts.push('ส่วนลด -'+lm(i.discount));
  return parts;
}
function buildBillText(invs, period, detail){
  if(invs.length===1){
    const i = invs[0]; const rm = roomById(i.roomId); const p = rm? propertyById(rm.propertyId):null;
    const lines = ['ใบแจ้งหนี้ '+(i.invoiceNumber||'-'), 'ห้อง '+i.roomCode+(p?' · '+p.name:'')+' · งวด '+periodLabel(i.period)];
    invoiceBreakdown(i).forEach(x=>lines.push('- '+x));
    lines.push('รวมทั้งสิ้น '+lm(i.total)+' บาท');
    if(i.status==='pending_discount') lines.push('(รออนุมัติส่วนลด)');
    return lines.join('\n');
  }
  const groups = new Map();
  invs.forEach(i=>{
    const rm = roomById(i.roomId); const p = rm? propertyById(rm.propertyId):null;
    const key = p? p.id : 'x';
    if(!groups.has(key)) groups.set(key, {name:p?p.name:'-', code:p?p.code:'', list:[]});
    groups.get(key).list.push(i);
  });
  const lines = ['สรุปใบแจ้งหนี้ งวด '+periodLabel(period)];
  let grand = 0;
  [...groups.values()].sort((a,b)=>a.code<b.code?-1:a.code>b.code?1:0).forEach(g=>{
    g.list.sort((a,b)=>String(a.roomCode).localeCompare(String(b.roomCode), 'en', {numeric:true}));
    const sum = g.list.reduce((s,i)=>s+Number(i.total||0),0); grand += sum;
    lines.push('', 'หอ '+g.name+' — '+g.list.length+' ห้อง รวม '+lm(sum)+' บาท');
    g.list.forEach(i=>{
      const tag = i.status==='pending_discount' ? ' (รออนุมัติส่วนลด)' : (i.status==='paid' ? ' (ชำระแล้ว)' : '');
      lines.push(detail ? i.roomCode+' · '+invoiceBreakdown(i).join(' + ')+' = '+lm(i.total)+tag
                        : i.roomCode+' — '+lm(i.total)+' บาท'+tag);
    });
  });
  lines.push('', 'รวมทั้งหมด '+invs.length+' ห้อง '+lm(grand)+' บาท');
  return lines.join('\n');
}
async function openLineNotifyModal({invoices, period}){
  const single = !!(invoices && invoices.length===1);
  const ready = await lineStatus();
  const scopeIds = new Set(scopedRooms().map(r=>r.id));
  const periods = pastPeriods(currentPeriod(),3).slice().reverse();
  const startPeriod = period || (single? invoices[0].period : currentPeriod());
  const getInvs = p => single ? invoices : cache.invoices.filter(i=>i.period===p && i.status!=='cancelled' && scopeIds.has(i.roomId));
  const initial = getInvs(startPeriod);
  if(!initial.length){ toast('ยังไม่มีใบแจ้งหนี้ในงวดนี้ให้แจ้ง','err'); return; }
  const modalEl = openModal({
    title: single ? 'แจ้งใบแจ้งหนี้เข้ากลุ่มไลน์ — ห้อง '+initial[0].roomCode : 'แจ้งสรุปบิลเข้ากลุ่มไลน์',
    submitLabel: ready ? 'ส่งเข้ากลุ่มไลน์' : 'เปิด LINE เพื่อเลือกกลุ่ม', wide:true,
    onSubmit: async fd=>{
      const text = String(fd.get('text')||'').trim();
      if(!text) throw new Error('ไม่มีข้อความที่จะส่ง');
      const chunks = lineChunks(text);
      if(!ready){
        // no bot configured yet: hand the text to the LINE app and let the user pick the group
        const url = 'https://line.me/R/msg/text/?'+encodeURIComponent(text);
        if(url.length <= 1900) window.open(url, '_blank');
        try{ await navigator.clipboard.writeText(text); }catch(e){}
        toast(url.length<=1900 ? 'เปิด LINE แล้ว — เลือกกลุ่มที่จะส่ง' : 'คัดลอกข้อความแล้ว — เปิด LINE แล้ววางในกลุ่ม','ok');
        return;
      }
      if(chunks.length>5) throw new Error('ข้อความยาวเกินไป — ปิด "แสดงรายละเอียด" หรือเลือกหอพักเฉพาะหอ');
      await lineCall('send', {texts: chunks});
      const per = single ? initial[0].period : fd.get('period');
      await logAudit({action:'LINE_NOTIFY', entityType:'invoice', entityId: single? initial[0].id : '', newValue:{period:per, count: single?1:getInvs(per).length, messages:chunks.length}});
      toast('ส่งเข้ากลุ่มไลน์แล้ว','ok');
    },
    bodyHtml:
      (ready ? '<div class="help-box">ส่งผ่านบอท LINE เข้ากลุ่มที่ตั้งค่าไว้ — ตรวจข้อความ/แก้ไขได้ก่อนกดส่ง</div>'
             : '<div class="help-box" style="background:var(--warn-soft,#fff6e0);">ยังไม่ได้เชื่อมต่อบอท LINE (เจ้าของกิจการตั้งค่าได้ที่เมนู ตั้งค่าระบบ → แจ้งเตือน LINE) — ตอนนี้ปุ่มด้านล่างจะเปิดแอป LINE ให้คุณเลือกกลุ่มเองและคัดลอกข้อความให้</div>')+
      (single ? '' :
        '<div class="field-row"><div class="field"><label>งวดบิล</label><select name="period">'+periods.map(p=>'<option value="'+p+'" '+(p===startPeriod?'selected':'')+'>'+periodLabel(p)+'</option>').join('')+'</select></div>'+
        '<div class="field"><label>รูปแบบ</label><label style="display:flex;gap:8px;align-items:center;font-weight:400;"><input type="checkbox" name="detail" style="width:auto;"> แสดงรายละเอียด (ค่าเช่า/น้ำ/ไฟ/ส่วนกลาง)</label></div></div>')+
      '<div class="field"><label>ข้อความที่จะส่ง</label><textarea name="text" rows="14" style="font-family:var(--mono,monospace);font-size:13px;line-height:1.5;"></textarea>'+
      '<p class="hint" id="lineHint"></p></div>'});
  const ta = $('textarea[name=text]', modalEl), hint = $('#lineHint', modalEl);
  const sel = $('select[name=period]', modalEl), det = $('input[name=detail]', modalEl);
  function refresh(){
    const p = sel ? sel.value : startPeriod;
    const invs = getInvs(p);
    ta.value = invs.length ? buildBillText(invs, p, det && det.checked) : '(ไม่มีใบแจ้งหนี้ในงวดนี้)';
    const n = lineChunks(ta.value).length;
    hint.textContent = invs.length+' ใบ · '+ta.value.length.toLocaleString('th-TH')+' ตัวอักษร · จะส่งเป็น '+n+' ข้อความ'+(n>5?' (เกินที่ส่งได้ 5 ข้อความ — ลดรายละเอียด)':'');
  }
  if(sel) sel.addEventListener('change', refresh);
  if(det) det.addEventListener('change', refresh);
  ta.addEventListener('input', ()=>{ const n = lineChunks(ta.value).length; hint.textContent = ta.value.length.toLocaleString('th-TH')+' ตัวอักษร · จะส่งเป็น '+n+' ข้อความ'; });
  refresh();
}

}

function openInvoiceModal(){
  const eligible = scopedRooms().filter(r=>activeLeaseFor(r.id));
  if(!eligible.length){ toast('ยังไม่มีห้องที่มีสัญญาผู้เช่าที่ใช้งานอยู่ในขอบเขตที่เลือก','err'); return; }
  const periods = pastPeriods(currentPeriod(),3);
  openModal({title:'ออกใบแจ้งหนี้', onSubmit: async fd=>{
    const roomId = fd.get('roomId'); const room = roomById(roomId);
    await generateInvoice({roomId, roomCode:room.code, period:fd.get('period'), discount:fd.get('discount'), discountReason:fd.get('discountReason')});
  }, bodyHtml:
    '<div class="field"><label>ห้อง</label><select name="roomId" required>'+eligible.map(r=>'<option value="'+r.id+'">'+r.code+' — '+activeLeaseFor(r.id).tenantName+' (น้ำ:'+WATER_MODE_LABEL[roomWaterMode(r)]+' / ไฟ:'+ELEC_MODE_LABEL[roomElecMode(r)]+')</option>').join('')+'</select></div>'+
    '<div class="field"><label>งวดบิล</label><select name="period" required>'+periods.slice().reverse().map(p=>'<option value="'+p+'" '+(p===currentPeriod()?'selected':'')+'>'+periodLabel(p)+'</option>').join('')+'</select>'+
    '<p class="hint">ระบบจะดึงค่าเช่าและค่าส่วนกลางจากห้อง และคำนวณค่าน้ำ-ไฟจากมิเตอร์โดยอัตโนมัติ (ห้ามคิดค่าน้ำ-ไฟแยกถ้าห้องตั้งเป็น “รวมในค่าเช่า”)</p></div>'+
    '<div class="field-row"><div class="field"><label>ส่วนลด (บาท, ถ้ามี)</label><input name="discount" type="number" min="0" value="0"></div>'+
    '<div class="field"><label>เหตุผลส่วนลด</label><input name="discountReason" placeholder="ไม่บังคับถ้าไม่มีส่วนลด"></div></div>'+
    '<div class="help-box">ส่วนลดเกิน '+(cache.config.discountApprovalThreshold||100)+' บาท ต้องผ่านการอนุมัติจากเจ้าของกิจการ ส่วนลดของพนักงานทุกจำนวนต้องผ่านผู้ดูแลระบบขึ้นไปก่อนเสมอ</div>'});
}
function openPaymentModal(invoice){
  const paid = cache.payments.filter(p=>p.invoiceId===invoice.id && p.status==='active').reduce((s,p)=>s+p.amount,0);
  const remaining = Math.max(0, invoice.total-paid);
  openModal({title:'รับชำระเงิน — ห้อง '+invoice.roomCode, submitLabel:'บันทึกรับชำระ', onSubmit: async fd=>{
    const file = fd.get('slip');
    if(!file || file.size===0) throw new Error('ต้องแนบหลักฐานการชำระเงิน (สลิปโอน/รูปถ่าย) ก่อนออกใบเสร็จ');
    const slipDataUrl = await fileToCompressedDataUrl(file);
    await recordPayment({invoice, amount:fd.get('amount'), method:fd.get('method'), slipDataUrl});
  }, bodyHtml:
    '<div class="help-box">ระบบจะสร้างเลขที่ใบเสร็จให้อัตโนมัติแบบรันต่อเนื่อง หลังแนบหลักฐานการชำระเงินแล้วเท่านั้น พนักงานไม่สามารถกำหนดเลขที่เองได้</div>'+
    '<div class="field"><label>ยอดค้างชำระ</label><input value="'+money(remaining)+' บาท" disabled></div>'+
    '<div class="field"><label>จำนวนเงินที่รับ (บาท)</label><input name="amount" type="number" step="0.01" min="0.01" required value="'+remaining+'"></div>'+
    '<div class="field"><label>ช่องทางชำระเงิน</label><div class="radio-row" id="methodRow">'+
      ['cash:เงินสด','transfer:โอนธนาคาร','qr:QR พร้อมเพย์'].map(o=>{ const [v,l]=o.split(':');
        return '<label class="radio-opt'+(v==='transfer'?' checked':'')+'"><input type="radio" name="method" value="'+v+'" '+(v==='transfer'?'checked':'')+'> '+l+'</label>'; }).join('')+
    '</div><p class="hint">ระบบสนับสนุนการโอน/QR เป็นช่องทางหลัก เงินเข้าบัญชีกิจการโดยตรง ไม่ผ่านบัญชีส่วนตัวพนักงาน</p></div>'+
    '<div class="field"><label>หลักฐานการชำระเงิน (สลิปโอน/รูปถ่ายเงินสด) — บังคับ</label>'+
    '<input name="slip" type="file" accept="image/*" capture="environment" required>'+
    '<p class="hint">'+icon('camera')+' ใบเสร็จจะออกได้ก็ต่อเมื่อแนบหลักฐานนี้แล้วเท่านั้น</p></div>'});
  $all('#methodRow input').forEach(inp=>inp.addEventListener('change', ()=>{
    $all('.radio-opt', $('#methodRow')).forEach(l=>l.classList.toggle('checked', l.querySelector('input').checked));
  }));
}

/* ============================================================
   VIEW: PAYMENTS / RECEIPTS
   ============================================================ */
const ROOM_PAY_STATUS_LABEL = { PAID:'ชำระแล้ว', WAIVED:'ยกหนี้แล้ว', DUE:'ยังไม่ชำระ', OVERDUE:'ค้างชำระเกินกำหนด', NONE:'ยังไม่ออกบิล' };
function openReceiptInfoModal(payment){
  const modalEl = openModal({title:'ใบเสร็จ '+payment.receiptNumber+' — ห้อง '+payment.roomCode, submitLabel:'ปิด', onSubmit: async ()=>{}, bodyHtml:
    '<div class="field"><label>จำนวนเงิน</label><input value="'+money(payment.amount)+' บาท" disabled></div>'+
    '<div class="field"><label>ช่องทางชำระเงิน</label><input value="'+METHOD_LABEL[payment.method]+'" disabled></div>'+
    '<div class="field"><label>ผู้รับเงิน</label><input value="'+escapeHtml(payment.receivedByName)+' · '+fmtDateTime(payment.receivedAt)+'" disabled></div>'+
    (payment.slipDataUrl? '<div class="field"><label>หลักฐานการชำระเงิน</label><img class="photo-thumb" data-zoom="'+payment.slipDataUrl+'" src="'+payment.slipDataUrl+'" style="width:120px;height:120px;"></div>':'')});
  $all('[data-zoom]', modalEl).forEach(img=>img.addEventListener('click', ()=>lightbox(img.dataset.zoom)));
}
function renderPayments(root){
  const scopedRoomIds = new Set(scopedRooms().map(r=>r.id));
  const roomStatus = computeRoomPaymentStatus();
  const rows = cache.payments.filter(p=>scopedRoomIds.has(p.roomId)).slice().sort((a,b)=>{
    const ra=roomById(a.roomId), rb=roomById(b.roomId);
    const pa = ra? propertyById(ra.propertyId):null, pb = rb? propertyById(rb.propertyId):null;
    const ca = pa?pa.code:'', cb = pb?pb.code:'';
    if(ca!==cb) return ca<cb?-1:1;
    if(a.roomCode!==b.roomCode) return a.roomCode<b.roomCode?-1:1;
    return (b.receivedAt||'')<(a.receivedAt||'')?-1:1;
  });
  const gaps = computeReceiptGaps().filter(g=> selectedPropertyId==='ALL' || g.propertyId===selectedPropertyId);
  const counts = {PAID:0, DUE:0, OVERDUE:0, WAIVED:0, NONE:0};
  roomStatus.forEach(rs=>counts[rs.status]++);
  root.innerHTML =
    '<div class="section-title"><div><h2>การรับชำระเงิน &amp; ใบเสร็จ</h2><div class="desc">ออกใบเสร็จได้ต่อเมื่อแนบหลักฐานการชำระเงินแล้วเท่านั้น เลขที่รันต่อเนื่องโดยระบบ ห้ามลบ — ผิดพลาดต้อง VOID แล้วรับชำระใหม่แทน</div></div></div>'+
    '<div class="card"><div class="card-head"><div><h3>สถานะการชำระเงินรายห้อง — งวด '+periodLabel(currentPeriod())+'</h3>'+
      '<div class="desc">เรียงตามรหัสหอพัก แล้วเลขห้อง — เขียว: ชำระแล้ว · เหลือง: ยังไม่ถึงกำหนด (ไม่เกินวันที่ 5) · แดง: ค้างชำระเกินวันที่ 5</div></div>'+
      '<div class="tag-row"><span class="pill ok">ชำระแล้ว '+counts.PAID+'</span><span class="pill warn">รอครบกำหนด '+counts.DUE+'</span><span class="pill bad">ค้างเกินกำหนด '+counts.OVERDUE+'</span></div>'+
    '</div><div class="room-status-grid" id="roomStatusGrid"></div></div>'+
    (gaps.length? '<div class="help-box" style="background:var(--danger-soft);border-color:var(--danger);color:var(--danger);">'+
      icon('bell')+' พบเลขที่ใบเสร็จขาดหาย '+gaps.length+' เลข: '+gaps.map(g=>g.label).join(', ')+' — ตรวจสอบว่าถูก VOID อย่างถูกต้องหรือไม่</div>' : '')+
    '<div class="card"><div class="card-head"><h3>ประวัติรายการรับชำระเงิน / ใบเสร็จ</h3></div><div class="tbl-wrap"><table class="grid"><thead><tr>'+
      '<th>เลขที่ใบเสร็จ</th><th>ห้อง</th><th>จำนวนเงิน</th><th>ช่องทาง</th><th>หลักฐาน</th><th>ผู้รับเงิน</th><th>วัน-เวลา</th><th>สถานะ</th><th></th>'+
    '</tr></thead><tbody id="payBody"></tbody></table></div></div>';

  const grid = $('#roomStatusGrid');
  const multiProp = activeProperties().length>1;
  const stClass = {PAID:'st-ok', DUE:'st-warn', OVERDUE:'st-bad', WAIVED:'st-muted', NONE:'st-muted'};
  if(!roomStatus.length){ grid.innerHTML = '<div class="empty-row">ไม่มีห้องที่มีผู้เช่าในขอบเขตที่เลือก</div>'; }
  else grid.innerHTML = roomStatus.map((rs,idx)=>{
    const prop = propertyById(rs.room.propertyId);
    return '<button type="button" class="room-status-btn '+stClass[rs.status]+'" data-roomstat="'+idx+'">'+
      '<span class="rs-room">'+rs.room.code+(multiProp && prop? ' <span style="font-weight:600;opacity:.7;">('+prop.code+')</span>':'')+'</span>'+
      '<span class="rs-tenant">'+(rs.lease? escapeHtml(rs.lease.tenantName):'-')+'</span>'+
      '<span class="rs-status">'+ROOM_PAY_STATUS_LABEL[rs.status]+(rs.invoice? ' · '+money(rs.invoice.total)+' ฿':'')+'</span>'+
    '</button>';
  }).join('');
  $all('[data-roomstat]', grid).forEach(b=>b.addEventListener('click', ()=>{
    const rs = roomStatus[Number(b.dataset.roomstat)];
    if(!rs.invoice){ toast('ห้อง '+rs.room.code+' ยังไม่มีใบแจ้งหนี้งวดนี้ — ไปที่หน้า "ใบแจ้งหนี้" เพื่อออกบิล','warn'); return; }
    if(rs.status==='DUE' || rs.status==='OVERDUE'){ openPaymentModal(rs.invoice); }
    else if(rs.status==='PAID'){
      const pay = cache.payments.filter(p=>p.invoiceId===rs.invoice.id && p.status==='active').sort((a,b)=>(b.receivedAt||'')<(a.receivedAt||'')?-1:1)[0];
      if(pay) openReceiptInfoModal(pay); else toast('ชำระแล้วแต่ไม่พบใบเสร็จ','warn');
    } else {
      toast('ห้อง '+rs.room.code+' — '+ROOM_PAY_STATUS_LABEL[rs.status],'ok');
    }
  }));

  const body = $('#payBody');
  const stMap = {active:'ok', void:'bad', refunded:'muted'};
  const stLabel = {active:'ปกติ', void:'ยกเลิก (VOID)', refunded:'คืนเงินแล้ว'};
  if(!rows.length){ body.innerHTML = '<tr><td colspan="9" class="empty-row">ยังไม่มีรายการรับชำระเงิน</td></tr>'; }
  else body.innerHTML = rows.map(p=>
    '<tr><td class="mono">'+p.receiptNumber+(p.replacesPaymentId?'<div class="footnote">แทนใบเดิม</div>':'')+'</td><td><strong>'+p.roomCode+'</strong></td><td class="num">'+money(p.amount)+'</td>'+
    '<td>'+METHOD_LABEL[p.method]+'</td>'+
    '<td>'+(p.slipDataUrl? '<img class="photo-thumb" data-zoom="'+p.slipDataUrl+'" src="'+p.slipDataUrl+'">' : '<span class="pill bad">ไม่มี</span>')+'</td>'+
    '<td>'+escapeHtml(p.receivedByName)+'</td><td>'+fmtDateTime(p.receivedAt)+'</td>'+
    '<td><span class="pill '+stMap[p.status]+'">'+stLabel[p.status]+'</span></td>'+
    '<td style="text-align:right;white-space:nowrap;">'+
      (p.status==='active' ? '<button class="btn sm" data-void="'+p.id+'">ขอยกเลิก</button> <button class="btn sm" data-refund="'+p.id+'">ขอคืนเงิน</button>' : '')+
    '</td></tr>'
  ).join('');
  $all('[data-zoom]', body).forEach(img=>img.addEventListener('click', ()=>lightbox(img.dataset.zoom)));
  $all('[data-void]', body).forEach(b=>b.addEventListener('click', ()=>{
    const p = cache.payments.find(x=>x.id===b.dataset.void);
    openModal({title:'ขอยกเลิกใบเสร็จ '+p.receiptNumber, submitLabel:'ส่งคำขอ', onSubmit: async fd=>{ await requestVoidPayment(p, fd.get('reason')); },
      bodyHtml:'<div class="help-box">การยกเลิกใบเสร็จต้องได้รับอนุมัติจากเจ้าของกิจการ ใบเสร็จจะยังคงอยู่ในลำดับเลขที่เสมอ ไม่ถูกลบ — รับชำระใหม่อีกครั้งเพื่อออกใบเสร็จเลขใหม่แทนได้หลังอนุมัติ</div><div class="field"><label>เหตุผล</label><textarea name="reason" required></textarea></div>'});
  }));
  $all('[data-refund]', body).forEach(b=>b.addEventListener('click', ()=>{
    const p = cache.payments.find(x=>x.id===b.dataset.refund);
    openModal({title:'ขอคืนเงิน — ใบเสร็จ '+p.receiptNumber, submitLabel:'ส่งคำขอ', onSubmit: async fd=>{ await requestRefund(p, fd.get('reason')); },
      bodyHtml:'<div class="help-box">การคืนเงินต้องได้รับอนุมัติจากเจ้าของกิจการ</div><div class="field"><label>เหตุผล</label><textarea name="reason" required></textarea></div>'});
  }));
}

/* ============================================================
   VIEW: REPAIR REQUESTS (แจ้งซ่อม)
   ============================================================ */
function renderRepairs(root){
  const scopedRoomIds = new Set(scopedRooms().map(r=>r.id));
  const all = cache.repairRequests.filter(rq=>scopedRoomIds.has(rq.roomId));
  const open = all.filter(rq=>rq.status==='OPEN').slice().sort((a,b)=> (a.reportedDate||'')<(b.reportedDate||'')?-1:1);
  const closed = all.filter(rq=>rq.status==='CLOSED').slice().sort((a,b)=> (b.closedAt||'')<(a.closedAt||'')?-1:1).slice(0,20);
  const rooms = scopedRooms().slice().sort((a,b)=>a.code<b.code?-1:1);

  root.innerHTML =
    '<div class="section-title"><div><h2>แจ้งซ่อม</h2><div class="desc">แจ้งปัญหาที่ต้องซ่อมพร้อมรูปถ่าย (สูงสุด 10 รูป) — ปิดงานเมื่อซ่อมเสร็จพร้อมบันทึกค่าใช้จ่ายเข้าบัญชีค่าใช้จ่ายอัตโนมัติ</div></div>'+
      (can('REPORT_REPAIR') && rooms.length? '<button class="btn primary" id="newRepairBtn">'+icon('plus')+' แจ้งซ่อมใหม่</button>':'')+'</div>'+
    '<div class="card"><div class="card-head"><h3>งานซ่อมที่ยังไม่ปิด ('+open.length+')</h3></div><div class="card-body flush" id="openRepairWrap"></div></div>'+
    '<div class="card"><div class="card-head"><h3>ประวัติงานซ่อมที่ปิดแล้ว</h3></div><div class="card-body flush" id="closedRepairWrap"></div></div>';

  const ow = $('#openRepairWrap');
  if(!open.length){ ow.innerHTML = '<div class="empty-row">ไม่มีงานซ่อมค้างอยู่</div>'; }
  else ow.innerHTML = open.map(rq=>{
    const prop = propertyById(rq.propertyId);
    const thumbs = (rq.photos||[]).slice(0,4).map(src=>'<img class="photo-thumb" data-zoom="'+src+'" src="'+src+'">').join('');
    const more = (rq.photos||[]).length>4? '<span class="pill muted">+'+((rq.photos||[]).length-4)+'</span>':'';
    return '<div class="alert-row warn"><div class="alert-stripe"></div><div style="flex:1;min-width:0;">'+
      '<div class="alert-title">ห้อง '+rq.roomCode+(prop?' · '+escapeHtml(prop.name):'')+' — '+escapeHtml(rq.point)+'</div>'+
      '<div class="alert-detail">แจ้งเมื่อ '+fmtDate(rq.reportedDate)+' โดย '+escapeHtml(rq.createdByName)+'</div>'+
      '<div class="tag-row" style="margin-top:8px;">'+thumbs+more+'</div></div>'+
      (can('MANAGE_REPAIRS')? '<button class="btn sm primary" data-closerepair="'+rq.id+'">ปิดงาน + บันทึกค่าใช้จ่าย</button>':'')+
      '</div>';
  }).join('');
  $all('[data-zoom]', ow).forEach(img=>img.addEventListener('click', ()=>lightbox(img.dataset.zoom)));
  $all('[data-closerepair]', ow).forEach(b=>b.addEventListener('click', ()=>{
    const rq = cache.repairRequests.find(x=>x.id===b.dataset.closerepair);
    openModal({title:'ปิดงานซ่อม — ห้อง '+rq.roomCode, submitLabel:'ปิดงานซ่อม', onSubmit: async fd=>{
      await closeRepairRequest(rq, {cost:fd.get('cost'), costNote:fd.get('costNote')});
    }, bodyHtml:
      '<p style="font-size:13px;color:var(--text-muted);">จุดที่ซ่อม: '+escapeHtml(rq.point)+'</p>'+
      '<div class="field"><label>ค่าใช้จ่ายในการซ่อม (บาท)</label><input name="cost" type="number" min="0" step="0.01" required value="0">'+
      '<p class="hint">ถ้ามีค่าใช้จ่าย ระบบจะบันทึกเข้า "รายรับ-รายจ่ายอื่นๆ" ให้อัตโนมัติ</p></div>'+
      '<div class="field"><label>หมายเหตุ</label><textarea name="costNote" placeholder="เช่น เปลี่ยนคอมเพรสเซอร์แอร์"></textarea></div>'});
  }));

  const cw = $('#closedRepairWrap');
  if(!closed.length){ cw.innerHTML = '<div class="empty-row">ยังไม่มีประวัติงานซ่อมที่ปิดแล้ว</div>'; }
  else cw.innerHTML = closed.map(rq=>
    '<div class="alert-row"><div style="flex:1;"><div class="alert-title">ห้อง '+rq.roomCode+' — '+escapeHtml(rq.point)+'</div>'+
    '<div class="alert-detail">แจ้ง '+fmtDate(rq.reportedDate)+' · ปิดงานโดย '+escapeHtml(rq.closedByName)+' เมื่อ '+fmtDateTime(rq.closedAt)+(rq.costNote?' · '+escapeHtml(rq.costNote):'')+'</div></div>'+
    '<span class="pill ok">'+(rq.cost>0? money(rq.cost)+' ฿' : 'ไม่มีค่าใช้จ่าย')+'</span></div>'
  ).join('');

  if($('#newRepairBtn')) $('#newRepairBtn').addEventListener('click', ()=>{
    openModal({title:'แจ้งซ่อมใหม่', submitLabel:'แจ้งซ่อม', onSubmit: async fd=>{
      const files = fd.getAll('photos').filter(f=>f && f.size>0);
      if(files.length>10) throw new Error('แนบรูปได้สูงสุด 10 รูป');
      const photos = [];
      for(const f of files){ photos.push(await fileToCompressedDataUrl(f)); }
      await createRepairRequest({roomId:fd.get('roomId'), point:fd.get('point'), reportedDate:fd.get('reportedDate'), photos});
    }, bodyHtml:
      '<div class="field"><label>ห้อง</label><select name="roomId" required>'+rooms.map(r=>{
        const prop = propertyById(r.propertyId);
        return '<option value="'+r.id+'">'+r.code+(prop?' — '+escapeHtml(prop.name):'')+'</option>';
      }).join('')+'</select></div>'+
      '<div class="field"><label>วันที่แจ้ง</label><input name="reportedDate" type="date" required value="'+todayStr()+'"></div>'+
      '<div class="field"><label>จุดที่ขอซ่อม</label><textarea name="point" required placeholder="เช่น แอร์ไม่เย็น ก๊อกน้ำห้องน้ำรั่ว"></textarea></div>'+
      '<div class="field"><label>รูปถ่ายประกอบ</label><input name="photos" type="file" accept="image/*" capture="environment" multiple>'+
      '<p class="hint">แนบได้สูงสุด 10 รูป</p></div>'});
  });
}

/* ============================================================
   VIEW: OTHER INCOME & EXPENSE LEDGER (รายรับ-รายจ่ายอื่นๆ)
   Feeds the per-property profit/loss summary on the dashboard — log the property's
   own water/electric bills and other overhead here as ค่าใช้จ่าย, and non-rent income
   (coin laundry, parking, etc.) as รายได้อื่น.
   ============================================================ */
function renderExpenses(root){
  const props = activeProperties();
  const scoped = selectedPropertyId==='ALL' ? cache.expenses : cache.expenses.filter(e=>e.propertyId===selectedPropertyId);
  const rows = scoped.slice().sort((a,b)=> (b.date||'')<(a.date||'')?-1:1);

/* Toggles the radio-opt "checked" style and swaps the item-field label/placeholder
   between expense examples (utility bills, upkeep) and income examples (coin laundry,
   parking) as the user switches ประเภทรายการ. */
function wireExpenseTypeToggle(modalEl){
  const row = $('#expTypeRow', modalEl); if(!row) return;
  const itemLabel = $('#expItemLabel', modalEl);
  const itemInput = $('#expItemInput', modalEl);
  $all('input[type=radio]', row).forEach(r=>r.addEventListener('change', ()=>{
    $all('.radio-opt', row).forEach(o=>o.classList.toggle('checked', o.querySelector('input').checked));
    if(r.checked && r.value==='INCOME'){
      itemLabel.textContent = 'รายการรับ';
      itemInput.placeholder = 'เช่น ค่าเครื่องซักผ้าหยอดเหรียญ, ค่าที่จอดรถ, ค่าขายของ';
    }else if(r.checked){
      itemLabel.textContent = 'รายการจ่าย';
      itemInput.placeholder = 'เช่น ค่าน้ำ-ไฟรวมของหอ (บิลการไฟฟ้า/ประปา), ค่าน้ำยาทำความสะอาด, ค่าจ้างพนักงาน';
    }
  }));
}
function openEditExpenseModal(e){
  const props = activeProperties();
  const curType = expenseType(e);
  const modalEl = openModal({title:'แก้ไขรายการ', submitLabel:'บันทึก', onSubmit: async fd=>{
    const prop = propertyById(fd.get('propertyId'));
    await updateExpense(e, {propertyId:fd.get('propertyId'), propertyCode: prop?prop.code:'', type:fd.get('type'), date:fd.get('date'),
      item:fd.get('item').trim(), amount:Number(fd.get('amount')), note:fd.get('note').trim()});
  }, bodyHtml:
    (props.length>1? '<div class="field"><label>หอพัก</label><select name="propertyId">'+props.map(p=>'<option value="'+p.id+'" '+(p.id===e.propertyId?'selected':'')+'>'+escapeHtml(p.name)+'</option>').join('')+'</select></div>'
      : '<input type="hidden" name="propertyId" value="'+e.propertyId+'">')+
    '<div class="field"><label>ประเภทรายการ</label><div class="radio-row" id="expTypeRow">'+
      '<label class="radio-opt '+(curType==='EXPENSE'?'checked':'')+'"><input type="radio" name="type" value="EXPENSE" '+(curType==='EXPENSE'?'checked':'')+'> ค่าใช้จ่าย</label>'+
      '<label class="radio-opt '+(curType==='INCOME'?'checked':'')+'"><input type="radio" name="type" value="INCOME" '+(curType==='INCOME'?'checked':'')+'> รายได้อื่น</label>'+
    '</div></div>'+
    '<div class="field"><label>วันที่ทำรายการ</label><input name="date" type="date" required value="'+e.date+'"></div>'+
    '<div class="field"><label id="expItemLabel">'+(curType==='INCOME'?'รายการรับ':'รายการจ่าย')+'</label><input name="item" id="expItemInput" required value="'+escapeHtml(e.item)+'"></div>'+
    '<div class="field"><label>ยอดเงิน (บาท)</label><input name="amount" type="number" min="0.01" step="0.01" required value="'+e.amount+'"></div>'+
    '<div class="field"><label>หมายเหตุ</label><input name="note" value="'+escapeHtml(e.note||'')+'"></div>'});
  wireExpenseTypeToggle(modalEl);
}

/* ============================================================
   VIEW: APPROVALS (Maker / Checker queue)
   ============================================================ */
function renderApprovals(root){
  const pending = cache.approvals.filter(a=>a.status==='PENDING').sort((a,b)=> (a.requestedAt||'')<(b.requestedAt||'')?-1:1);
  const resolved = cache.approvals.filter(a=>a.status!=='PENDING').sort((a,b)=> (b.approvedAt||'')<(a.approvedAt||'')?-1:1).slice(0,20);
  root.innerHTML =
    '<div class="section-title"><div><h2>คำขออนุมัติ</h2><div class="desc">Void / คืนเงิน / ยกเลิกใบแจ้งหนี้ / ยกหนี้ / ส่วนลด — ผู้ร้องขอห้ามอนุมัติรายการของตนเอง</div></div></div>'+
    '<div class="card"><div class="card-head"><h3>รอดำเนินการ ('+pending.length+')</h3></div><div class="card-body flush" id="pendingWrap"></div></div>'+
    '<div class="card"><div class="card-head"><h3>ประวัติล่าสุด</h3></div><div class="card-body flush" id="resolvedWrap"></div></div>';

  const pw = $('#pendingWrap');
  if(!pending.length){ pw.innerHTML = '<div class="empty-row">ไม่มีคำขอค้างอนุมัติ</div>'; }
  else pw.innerHTML = pending.map(a=>{
    const isSelf = a.requestedBy===Session.user.id;
    const rank = {STAFF:0,ADMIN:1,OWNER:2};
    const eligible = !isSelf && rank[Session.user.role] >= rank[a.requiredRole||'OWNER'];
    const reqStaff = cache.staff.find(s=>s.id===a.requestedBy);
    return '<div class="alert-row warn"><div class="alert-stripe"></div><div style="flex:1;min-width:0;">'+
      '<div class="alert-title">'+APPROVAL_TYPE_LABEL[a.type]+(a.roomCode&&a.roomCode!=='-'?' — ห้อง '+a.roomCode:'')+(a.amount?' · '+money(a.amount)+' บาท':'')+'</div>'+
      '<div class="alert-detail">เหตุผล: '+escapeHtml(a.reason)+'</div>'+
      '<div class="alert-meta">ร้องขอโดย '+escapeHtml(a.requestedByName)+' ('+(reqStaff?ROLE_LABEL[reqStaff.role]:'-')+') · ต้องการอนุมัติระดับ '+ROLE_LABEL[a.requiredRole||'OWNER']+' · '+fmtDateTime(a.requestedAt)+'</div></div>'+
      '<div class="tag-row">'+
      (eligible ? '<button class="btn sm primary" data-approve="'+a.id+'">อนุมัติ</button><button class="btn sm danger" data-reject="'+a.id+'">ปฏิเสธ</button>' :
        '<span class="pill muted">'+(isSelf?'รอผู้อื่นอนุมัติ':'ต้องสิทธิ์ '+ROLE_LABEL[a.requiredRole||'OWNER'])+'</span>')+
      '</div></div>';
  }).join('');
  $all('[data-approve]', pw).forEach(b=>b.addEventListener('click', async ()=>{
    try{ await resolveApproval(cache.approvals.find(a=>a.id===b.dataset.approve), 'APPROVED'); }catch(e){ toast(e.message,'err'); }
  }));
  $all('[data-reject]', pw).forEach(b=>b.addEventListener('click', ()=>{
    const a = cache.approvals.find(x=>x.id===b.dataset.reject);
    confirmModal({title:'ปฏิเสธคำขอ', submitLabel:'ยืนยันปฏิเสธ', bodyHtml:'<p>ปฏิเสธคำขอ “'+APPROVAL_TYPE_LABEL[a.type]+'” ของ '+escapeHtml(a.requestedByName)+' ใช่หรือไม่?</p>',
      onSubmit: async ()=>{ await resolveApproval(a,'REJECTED'); }});
  }));

  const rw = $('#resolvedWrap');
  if(!resolved.length){ rw.innerHTML = '<div class="empty-row">ยังไม่มีประวัติ</div>'; }
  else rw.innerHTML = resolved.map(a=>
    '<div class="alert-row"><div style="flex:1;"><div class="alert-title">'+APPROVAL_TYPE_LABEL[a.type]+(a.roomCode&&a.roomCode!=='-'?' — ห้อง '+a.roomCode:'')+'</div>'+
    '<div class="alert-detail">ร้องขอโดย '+escapeHtml(a.requestedByName)+' · '+(a.approvedByName? (a.status==='APPROVED'?'อนุมัติ':'ปฏิเสธ')+'โดย '+escapeHtml(a.approvedByName):'')+' · '+fmtDateTime(a.approvedAt)+'</div></div>'+
    '<span class="pill '+(a.status==='APPROVED'?'ok':'bad')+'">'+(a.status==='APPROVED'?'อนุมัติแล้ว':'ปฏิเสธ')+'</span></div>'
  ).join('');
}

        (canManageStaffTarget(s)? '<button class="btn sm" data-editstaff="'+s.id+'">แก้ไข</button>':'')+
        (canManageStaffTarget(s)? (s.active!==false?
          ' <button class="btn sm" data-deactivate="'+s.id+'">ปิดใช้งาน</button>' :
          ' <button class="btn sm" data-reactivate="'+s.id+'">เปิดใช้งาน</button>') : '')+
      '</td></tr>').join('')+
    '</tbody></table></div></div>'+
    '<div class="card"><div class="card-head"><h3>สิทธิ์ตามบทบาท</h3></div><div class="card-body">'+
    '<div class="tbl-wrap"><table class="grid"><thead><tr><th>บทบาท</th><th>สิทธิ์การใช้งาน</th></tr></thead><tbody>'+
    '<tr><td><span class="role-chip STAFF">STAFF</span></td><td>เข้าเมนู: แดชบอร์ด · ห้องพัก&amp;ผู้เช่า · จองห้องพัก · มิเตอร์น้ำ-ไฟ · ใบแจ้งหนี้ · การรับชำระเงิน · แจ้งซ่อม · รายรับ-รายจ่ายอื่นๆ (เพิ่มรายการได้ แต่แก้ไข/ลบไม่ได้ · รายการที่กระทบเงิน/ยกเลิก/ส่วนลด ต้องผ่านอนุมัติจาก Admin/Owner) — ไม่เห็นเมนูหอพัก/คำขออนุมัติ/บันทึกตรวจสอบ/ตั้งค่า</td></tr>'+
    '<tr><td><span class="role-chip ADMIN">ADMIN</span></td><td>เข้าได้ทุกเมนู รวมถึงหอพัก/คำขออนุมัติ/บันทึกตรวจสอบ/ตั้งค่า · สร้าง/แก้ไข/ลบหอพักและห้องพักได้ · สร้างบัญชีพนักงานระดับ Staff ได้ · แก้ไข/ปิดใช้งานบัญชี Staff และ Admin คนอื่นได้ (ยกเว้นบัญชีตัวเอง) แต่แก้ไข/ปิดใช้งานบัญชีเจ้าของกิจการ (Owner) ไม่ได้</td></tr>'+
    '<tr><td><span class="role-chip OWNER">OWNER</span></td><td>เข้าได้ทุกเมนู · สร้าง/แก้ไข/ลบหอพักและห้องพัก · สร้างบัญชีทุกระดับ · แก้ไข/ปิดใช้งานบัญชีใครก็ได้ทุกระดับ (ยกเว้นบัญชีตัวเอง) · อนุมัติ Void / Refund / ส่วนลดวงเงินสูง / ยกหนี้</td></tr>'+
    '</tbody></table></div></div></div>';

  if($('#lineCard')) initLineSettings($('#lineCard'));
  if($('#autoCard')) initAutoSettings($('#autoCard'));
  if($('#cfgForm')) $('#cfgForm').addEventListener('submit', async e=>{
    e.preventDefault(); const fd = new FormData(e.target);
    const patch = { waterRate:Number(fd.get('waterRate')), elecRate:Number(fd.get('elecRate')), defaultCommonFee:Number(fd.get('defaultCommonFee')),
      vacantUsageThreshold:Number(fd.get('vacantUsageThreshold')), anomalyPercent:Number(fd.get('anomalyPercent')),
      discountApprovalThreshold:Number(fd.get('discountApprovalThreshold')) };
    await Store.update('config','settings', patch);
    await logAudit({action:'UPDATE_SETTINGS', entityType:'config', entityId:'settings', newValue:patch});
    toast('บันทึกการตั้งค่าแล้ว','ok');
  });
  if($('#addStaffBtn2')) $('#addStaffBtn2').addEventListener('click', ()=>{
    const assignable = allowedRolesToAssign();
    openModal({title:'สร้างบัญชีพนักงานใหม่', submitLabel:'สร้างบัญชี', onSubmit: async fd=>{
      const username = fd.get('username').trim();
      const password = fd.get('password');
      const confirmPassword = fd.get('confirmPassword');
      if(!username) throw new Error('ต้องระบุชื่อผู้ใช้ (username)');
      if(usernameTaken(username, null)) throw new Error('มีชื่อผู้ใช้นี้อยู่แล้ว กรุณาใช้ชื่ออื่น');
      if(!/^[A-Za-z0-9._-]{3,32}$/.test(username)) throw new Error('ชื่อผู้ใช้ต้องเป็นภาษาอังกฤษ/ตัวเลข/จุด/ขีด ยาว 3-32 ตัวอักษร (เช่น staff2)');
      if(!password || password.length<6) throw new Error('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
      if(password!==confirmPassword) throw new Error('รหัสผ่านและการยืนยันรหัสผ่านไม่ตรงกัน');
      if(!assignable.includes(fd.get('role'))) throw new Error('คุณไม่มีสิทธิ์สร้างบัญชีบทบาทนี้');
      await adminCall('create_user', {name:fd.get('name').trim(), phone:fd.get('phone').trim(), role:fd.get('role'), username, password});
      await Store.loadStaff();
      await logAudit({action:'CREATE_STAFF_ACCOUNT', entityType:'staff', newValue:{username, role:fd.get('role')}});
      toast('สร้างบัญชี '+username+' แล้ว — แจ้งชื่อผู้ใช้และรหัสผ่านให้พนักงานได้เลย','ok');
    }, bodyHtml:
      '<div class="field"><label>ชื่อ-นามสกุล</label><input name="name" required></div>'+
      '<div class="field"><label>เบอร์โทร</label><input name="phone" placeholder="08x-xxx-xxxx"></div>'+
      '<div class="field"><label>ชื่อผู้ใช้ (username)</label><input name="username" required autocomplete="off" autocapitalize="none" placeholder="เช่น staff2 (ภาษาอังกฤษ/ตัวเลข)"></div>'+
      '<div class="field-row"><div class="field"><label>รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input name="password" type="password" required autocomplete="new-password"></div>'+
      '<div class="field"><label>ยืนยันรหัสผ่าน</label><input name="confirmPassword" type="password" required autocomplete="new-password"></div></div>'+
      '<div class="field"><label>บทบาท</label><select name="role">'+
        assignable.map(r=>'<option value="'+r+'">'+ROLE_LABEL[r]+'</option>').join('')+
      '</select></div>'});
  });
  const staffBody = $('#staffBody');
  if(staffBody){
    $all('[data-editstaff]', staffBody).forEach(b=>b.addEventListener('click', ()=>openEditStaffModal(cache.staff.find(s=>s.id===b.dataset.editstaff))));
    $all('[data-deactivate]', staffBody).forEach(b=>b.addEventListener('click', ()=>{
      const s = cache.staff.find(x=>x.id===b.dataset.deactivate);
      confirmModal({title:'ปิดใช้งานบัญชี '+s.name, submitLabel:'ยืนยันปิดใช้งาน', bodyHtml:
        '<p>ปิดใช้งานบัญชีของ <strong>'+escapeHtml(s.name)+'</strong>? บัญชีนี้จะไม่แสดงในหน้าเข้าสู่ระบบอีก แต่ประวัติเดิมยังตรวจสอบย้อนหลังได้เสมอ</p>',
        onSubmit: async ()=>{ await setStaffActive(s, false); }});
    }));
    $all('[data-reactivate]', staffBody).forEach(b=>b.addEventListener('click', async ()=>{
      try{ await setStaffActive(cache.staff.find(x=>x.id===b.dataset.reactivate), true); }catch(e){ toast(e.message,'err'); }
    }));
  }
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
sb.auth.onAuthStateChange((ev)=>{
  if(ev==='SIGNED_OUT' && authUserId){ authUserId = null; Store.reset(); route(); }
});
async function boot(){
  renderLoading();
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session){ authUserId = session.user.id; await startApp(); }
  }catch(e){ console.error(e); authUserId = null; }
  route();
}
boot();

})();
</script>
